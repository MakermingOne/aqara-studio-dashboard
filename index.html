<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqara Studio · 数据统计看板</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --ink:#12141f;
    --ink-2:#5b5f6e;
    --ink-3:#9a9eac;
    --line:#e6e7ec;
    --line-soft:#f0f1f5;
    --hover:#f7f8fa;
    --accent:#12141f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;height:56px;padding:0 32px;gap:24px;}
  .brand{font-size:17px;font-weight:700;letter-spacing:.2px;}
  .crumb{color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:8px;}
  .crumb a:hover{color:var(--ink);}
  .crumb .sep{color:var(--line);}
  .header-date{margin-left:auto;color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums;}

  main{max-width:1200px;margin:0 auto;padding:40px 32px 80px;}

  /* ---------- home：大屏卡片 ---------- */
  .page-title{font-size:24px;font-weight:700;margin-bottom:6px;}
  .page-sub{color:var(--ink-2);font-size:13px;margin-bottom:32px;}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  @media (max-width:860px){ .cards{grid-template-columns:1fr;} }

  .stat-card{position:relative;border:1px solid var(--line);background:#fff;
    padding:30px 30px 24px;cursor:pointer;
    transition:border-color .18s, box-shadow .18s, transform .18s;}
  .stat-card:hover{border-color:var(--ink);box-shadow:0 12px 32px rgba(18,20,31,.08);transform:translateY(-2px);}
  .stat-card .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px;}
  .stat-card .card-idx{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .stat-card .card-arrow{font-size:16px;color:var(--ink-3);transition:color .18s, transform .18s;}
  .stat-card:hover .card-arrow{color:var(--ink);transform:translateX(4px);}
  .stat-card .card-name{font-size:17px;font-weight:600;}
  .stat-card .card-desc{color:var(--ink-3);font-size:12px;margin-top:4px;min-height:36px;}
  .stat-card .card-value{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.5px;}
  .stat-card .card-unit{font-size:14px;color:var(--ink-3);font-weight:400;margin-left:6px;}
  .stat-card .card-meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);
    display:flex;justify-content:space-between;align-items:center;
    color:var(--ink-2);font-size:12px;}
  .stat-card .card-meta .live{display:inline-flex;align-items:center;gap:6px;}
  .stat-card .card-meta .dot{width:6px;height:6px;border-radius:50%;background:#0a7d4f;}

  /* ---------- detail：左侧导航 + 内容区 ---------- */
  .detail-layout{display:grid;grid-template-columns:216px 1fr;gap:36px;align-items:start;}
  @media (max-width:860px){ .detail-layout{grid-template-columns:1fr;} }

  .side-nav{border:1px solid var(--line);background:#fff;}
  .side-nav .nav-title{padding:13px 18px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);}
  .side-nav a{display:flex;align-items:center;gap:10px;padding:14px 18px;
    border-bottom:1px solid var(--line-soft);font-size:14px;color:var(--ink-2);
    transition:background .14s,color .14s;}
  .side-nav a:last-child{border-bottom:none;}
  .side-nav a:hover{background:var(--hover);color:var(--ink);}
  .side-nav a.on{background:var(--ink);color:#fff;}
  .side-nav a .nav-idx{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .side-nav a.on .nav-idx{color:rgba(255,255,255,.55);}
  .side-nav a .nav-unit{margin-left:auto;font-size:11px;color:var(--ink-3);}
  .side-nav a.on .nav-unit{color:rgba(255,255,255,.55);}

  .detail-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
  .filters{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;
    border:1px solid var(--line);padding:18px 20px;margin-bottom:28px;background:#fff;}
  .filter-group{display:flex;flex-direction:column;gap:8px;}
  .filter-label{font-size:12px;color:var(--ink-3);}
  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);}
  .seg button{padding:6px 12px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line);transition:background .12s,color .12s;background:#fff;}
  .seg button:last-child{border-right:none;}
  .seg button:hover{background:var(--hover);}
  .seg button.on{background:var(--accent);color:#fff;}
  select,input[type="date"]{font:inherit;color:var(--ink);border:1px solid var(--line);
    background:#fff;padding:6px 10px;font-size:13px;border-radius:0;outline:none;}
  select:focus,input[type="date"]:focus{border-color:var(--ink);}
  .time-range{display:flex;align-items:center;gap:8px;}
  .export-btn{margin-left:auto;border:1px solid var(--ink);padding:8px 18px;font-size:13px;font-weight:600;
    transition:background .12s,color .12s;align-self:flex-end;background:#fff;}
  .export-btn:hover{background:var(--ink);color:#fff;}

  .summary{display:flex;gap:48px;margin-bottom:24px;flex-wrap:wrap;}
  .sum-item .k{font-size:12px;color:var(--ink-3);margin-bottom:4px;}
  .sum-item .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
  .sum-item .v small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:4px;}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:#fff;}
  th,td{border:1px solid var(--line);padding:10px 14px;text-align:right;font-size:13px;}
  th{background:#fafbfc;font-weight:600;color:var(--ink-2);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  td:first-child{color:var(--ink-2);}
  tbody tr:hover{background:var(--hover);}
  .delta{color:var(--ink-2);}
  .note{margin-top:14px;color:var(--ink-3);font-size:12px;}
  .empty{padding:48px 0;text-align:center;color:var(--ink-3);}

  /* ---------- Tab 切换 ---------- */
  .tabs{display:inline-flex;border:1px solid var(--line);margin-bottom:18px;background:#fff;}
  .tabs button{padding:9px 22px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line);
    transition:background .14s,color .14s;}
  .tabs button:last-child{border-right:none;}
  .tabs button:hover{background:var(--hover);}
  .tabs button.on{background:var(--ink);color:#fff;}
  .tabs button .cnt{font-size:11px;color:var(--ink-3);margin-left:6px;}
  .tabs button.on .cnt{color:rgba(255,255,255,.55);}

  /* ---------- 折叠明细 ---------- */
  details.dwell-detail{margin-top:22px;border:1px solid var(--line);}
  details.dwell-detail summary{padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;
    list-style:none;background:#fafbfc;color:var(--ink-2);user-select:none;
    display:flex;justify-content:space-between;align-items:center;transition:background .14s;}
  details.dwell-detail summary::-webkit-details-marker{display:none;}
  details.dwell-detail summary:hover{background:var(--hover);}
  details.dwell-detail summary .hint{font-weight:400;font-size:12px;color:var(--ink-3);}
  details.dwell-detail[open] summary{border-bottom:1px solid var(--line);}
  details.dwell-detail table{border:none;}
</style>
</head>
<body>
<header>
  <div class="brand">Aqara Studio</div>
  <div class="crumb" id="crumb"></div>
  <div class="header-date" id="headerDate"></div>
</header>
<main id="app"></main>

<script>
/* =========================================================
 * 模拟设备上报数据（智能家居空间尺度）
 *  - realtime：实时变化上报，每次上报为当下实时人数准确值（演示数据以变化事件存储）
 *  - visits / distance：半小时粒度增量序列
 *  - dwell：Σ(实时人数 × 持续时长) ÷ 访问人次
 * 真实环境中由后端接口提供，此处生成演示数据
 * ========================================================= */
const REGIONS = Array.from({length:8}, (_,i) => `区域 ${i+1}`); // 8 个自定义区域
const HOURS = 24;
const SLOTS = 48; // 半小时粒度
const RT_CAP = 10; // 侦测能力上限 10 人，超过显示 10+，任何展示都不会大于 10

function seededRand(seed){
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}
const rand = seededRand(20261013);

function dayFactor(h){ // h 可为小数（半小时槽取半值）
  return Math.exp(-Math.pow(h - 14, 2) / 40) + Math.exp(-Math.pow(h - 10, 2) / 18) * .6;
}

function genRaw(){
  const days = 7; // 最近 7 天
  const data = {};
  const today = new Date();
  const nowH = today.getHours(), nowM = today.getMinutes();
  for(let d = days - 1; d >= 0; d--){
    const dt = new Date(today); dt.setDate(today.getDate() - d);
    const key = fmtDate(dt);
    const isToday = d === 0;
    const endH = isToday ? nowH : 23;      // 今日只生成到当前时刻
    const endM = isToday ? nowM : 59;
    const lastMin = endH * 60 + endM;      // 数据覆盖到的最后一分钟
    data[key] = { realtime:{}, visits:{}, dwell:{}, distance:new Array(SLOTS).fill(0) };

    REGIONS.forEach((r, ri) => {
      /* 实时人数：实时变化上报，每次上报为当下实时人数准确值 */
      const events = [];
      let count = 0;
      for(let h = 0; h <= endH; h++){
        const maxMin = (h === endH) ? endM : 59;
        const nEv = Math.floor(rand() * 3); // 每小时 0-2 次上报（家庭活动尺度）
        for(let i = 0; i < nEv; i++){
          const min = Math.floor(rand() * (maxMin + 1));
          let delta;
          const pIn = count === 0 ? 1 : (count < 8 ? 0.6 : 0.2); // 高人数时偏向离开
          if(rand() < pIn) delta = rand() < 0.3 ? 2 : 1;         // +1 / +2
          else delta = -(1 + Math.floor(rand() * 2));            // -1 / -2
          count = Math.max(0, count + delta);
          events.push({ h, min, delta });
        }
      }
      data[key].realtime[r] = events;

      /* 访问人次：半小时粒度增量（家庭尺度：每区域每天数十人次） */
      const visitsArr = new Array(SLOTS).fill(0);
      for(let s = 0; s < SLOTS; s++){
        if(s * 30 <= lastMin)
          visitsArr[s] = Math.round(dayFactor(s / 2) * (ri + 1) * (0.5 + rand()));
      }
      data[key].visits[r] = visitsArr;
      const totalVisits = sumArr(visitsArr);

      /* 平均驻留时长公式：Σ(实时人数 × 该实时人数持续时长) ÷ 访问人次 */
      const ev = [...events].sort((a,b) => (a.h*60 + a.min) - (b.h*60 + b.min));
      let dwellMin = 0, cur = 0, prevT = 0;
      ev.forEach(e => {
        const t = e.h * 60 + e.min;
        dwellMin += cur * (t - prevT);
        cur = Math.max(0, cur + e.delta);
        prevT = t;
      });
      dwellMin += cur * (lastMin + 1 - prevT);
      data[key].dwell[r] = {
        visits: totalVisits,
        personMin: Math.round(dwellMin),
        avg: totalVisits ? +(dwellMin / totalVisits).toFixed(1) : 0
      };
    });

    /* 今日行走距离：全区域，单位 m，精度 1 m（单人全天室内 ≤ 1000 m） */
    for(let s = 0; s < SLOTS; s++){
      if(s * 30 <= lastMin)
        data[key].distance[s] = Math.round(dayFactor(s / 2) * 40 * (0.5 + rand()));
    }
  }
  return data;
}
const RAW = genRaw();

const METRICS = {
  realtime: { name:"实时人数", unit:"人", mode:"realtime",
    desc:"实时变化上报，历史数据为每次上报的实时人数准确值；小时区间内统计最高值，侦测上限 10 人，超过显示 10+" },
  visits:   { name:"访问人次", unit:"人次", mode:"sum", precision:0, hasRegion:true,
    desc:"按时段累计访问人次",
    cols:["时间段","区域","时间段增量（人次）","时段内累计（人次）"] },
  dwell:    { name:"平均驻留时长", unit:"分钟", mode:"snapshot", hasRegion:true,
    desc:"分区统计：当天累计至当前时刻，历史日期为全天固定值；历史对比：分区域逐日变化图表与矩阵",
    cols:["时间段","时段访问人次（人次）","时段累计驻留（人·分钟）","平均驻留时长（分钟）"] },
  distance: { name:"今日行走距离", unit:"m", mode:"sum", precision:0, hasRegion:false,
    desc:"全区域累计行走距离（不分区域），单位 m，精度 1 m",
    cols:["时间段","时间段增量（m）","时段内累计（m）"] },
};

/* ---------- 工具 ---------- */
function fmtDate(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtHM(h, m){ return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0"); }
/* 半小时槽 → "HH:MM"（s 范围 0..47） */
function fmtSlot(s){ return fmtHM((s / 2) | 0, (s % 2) * 30); }
/* 槽位区间标签：s 到 s+1（48 显示 24:00） */
function slotLabel(s){ return `${fmtSlot(s)} – ${s + 1 >= SLOTS ? "24:00" : fmtSlot(s + 1)}`; }
/* 区间终点标签（to 为排他的槽位，48 显示 24:00） */
function spanLabel(from, to){ return `${fmtSlot(from)} – ${to >= SLOTS ? "24:00" : fmtSlot(to)}`; }
function sumArr(a){ return a.reduce((s,x)=>s+x,0); }
function todayKey(){ return fmtDate(new Date()); }
/* 实时人数显示：侦测上限 10，任何展示都不会大于 10 */
function fmtRT(n){ return n > RT_CAP ? "10+" : String(n); }
/* 通用数字格式化 */
function fmtNum(v, precision){ return (+v).toFixed(precision == null ? 0 : precision); }

/* 访问人次 / 行走距离的半小时增量序列 */
function series(dateKey, metric, region){
  const day = RAW[dateKey]; if(!day) return new Array(SLOTS).fill(0);
  if(metric === "distance") return day.distance;
  if(region === "全区域"){
    const out = new Array(SLOTS).fill(0);
    REGIONS.forEach(r => day[metric][r].forEach((v,i)=> out[i]+=v));
    return out;
  }
  return day[metric][region];
}

/* ---------- 实时人数：由上报事件重建分钟级人数曲线 ---------- */
const tlCache = {};
function rtTimelines(dateKey){
  if(tlCache[dateKey]) return tlCache[dateKey];
  const day = RAW[dateKey];
  const tls = {};
  REGIONS.forEach(r => {
    const tl = new Array(24 * 60).fill(0);
    const ev = [...day.realtime[r]].sort((a,b) => (a.h*60 + a.min) - (b.h*60 + b.min));
    let count = 0, ei = 0;
    for(let m = 0; m < 24 * 60; m++){
      while(ei < ev.length && ev[ei].h * 60 + ev[ei].min <= m){ count = Math.max(0, count + ev[ei].delta); ei++; }
      tl[m] = count;
    }
    tls[r] = tl;
  });
  const all = new Array(24 * 60).fill(0);
  REGIONS.forEach(r => { for(let m = 0; m < 24 * 60; m++) all[m] += tls[r][m]; });
  tls["全区域"] = all;
  tlCache[dateKey] = tls;
  return tls;
}
/* 该日期数据覆盖到的最后一分钟（今日为当前时刻，历史日为 23:59） */
function lastDataMinute(dateKey){
  const now = new Date();
  return dateKey === todayKey() ? now.getHours() * 60 + now.getMinutes() : 24 * 60 - 1;
}
/* 当前实时人数 */
function rtCurrent(dateKey, region){
  const tl = rtTimelines(dateKey)[region];
  return tl[lastDataMinute(dateKey)];
}
/* 任意分钟区间最高实时人数 [startMin, endMin) */
function rtRangeMax(dateKey, region, startMin, endMin){
  const tl = rtTimelines(dateKey)[region];
  let mx = 0;
  for(let m = startMin; m < endMin; m++) if(tl[m] > mx) mx = tl[m];
  return mx;
}

/* =========================================================
 * 路由 / 渲染
 * ========================================================= */
const app = document.getElementById("app");
const crumb = document.getElementById("crumb");
document.getElementById("headerDate").textContent =
  new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});

const state = {}; // 每个模块的筛选状态
function getState(m){
  if(!state[m]) state[m] = { date: todayKey(), from: 0, to: SLOTS, region: "全区域", tab: "hour" };
  return state[m];
}

function render(){
  const hash = location.hash.replace(/^#\/?/, "");
  const m = Object.keys(METRICS).find(k => hash === k);
  if(m) renderDetail(m); else renderHome();
}
window.addEventListener("hashchange", render);

/* ---------- 首页：大屏卡片 ---------- */
function renderHome(){
  crumb.innerHTML = "";
  const key = todayKey();
  const now = new Date();
  const nowStr = fmtHM(now.getHours(), now.getMinutes());
  const cards = Object.entries(METRICS).map(([k, cfg], i) => {
    let val, meta, isLive = false;
    if(cfg.mode === "realtime"){
      val = fmtRT(rtCurrent(key, "全区域")); meta = `此刻 ${nowStr} · 全区域`; isLive = true;
    }else if(cfg.mode === "snapshot"){
      const d = RAW[key].dwell;
      const allV = sumArr(REGIONS.map(r => d[r].visits));
      const allMin = sumArr(REGIONS.map(r => d[r].personMin));
      val = allV ? (allMin / allV).toFixed(1) : "0.0"; meta = `此刻 ${nowStr} · 全区域`; isLive = true;
    }else{
      const s = series(key, k, "全区域");
      val = fmtNum(sumArr(s), cfg.precision); meta = "今日 · 全区域";
    }
    return `
      <div class="stat-card" onclick="location.hash='#/${k}'">
        <div class="card-top">
          <span class="card-idx">0${i+1}</span>
          <span class="card-arrow">→</span>
        </div>
        <div class="card-name">${cfg.name}</div>
        <div class="card-desc">${cfg.desc}</div>
        <div class="card-value">${val}<span class="card-unit">${cfg.unit}</span></div>
        <div class="card-meta">
          <span class="${isLive ? "live" : ""}">${isLive ? `<span class="dot"></span>` : ""}${meta}</span>
          <span>查看明细</span>
        </div>
      </div>`;
  }).join("");
  app.innerHTML = `
    <div class="page-title">数据统计</div>
    <div class="page-sub">智能家居空间尺度 · 实时人数侦测上限 10 人 · 设备按半小时粒度上报 · 点击卡片查看明细与导出</div>
    <div class="cards">${cards}</div>
    <div class="note">第二阶段将加入趋势图表，当前为数据框架与表格演示。</div>`;
}

/* ---------- 详情页：左侧导航 + 内容区 ---------- */
function sideNavHTML(active){
  return `
    <aside class="side-nav">
      <div class="nav-title">数据统计</div>
      ${Object.entries(METRICS).map(([k,cfg],i) => `
        <a href="#/${k}" class="${k===active?"on":""}">
          <span class="nav-idx">0${i+1}</span>
          <span>${cfg.name}</span>
          <span class="nav-unit">${cfg.unit}</span>
        </a>`).join("")}
    </aside>`;
}

function renderDetail(m){
  const cfg = METRICS[m];
  crumb.innerHTML = `<a href="#/">数据统计</a><span class="sep">/</span><span>${cfg.name}</span>`;
  app.innerHTML = `<div class="detail-layout">${sideNavHTML(m)}<div class="detail-main" id="detailMain"></div></div>`;
  if(m === "realtime") return renderRealtime();
  if(m === "dwell") return renderDwell();
  renderGeneric(m);
}

/* 通用筛选条（日期 + 半小时粒度时间段 + 区域） */
function filterBarHTML(cfg, st){
  const fromOpts = Array.from({length:SLOTS},(_,s)=>
    `<option value="${s}" ${s===st.from?"selected":""}>${fmtSlot(s)}</option>`).join("");
  const toOpts = Array.from({length:SLOTS},(_,i)=>{ const s = i + 1;
    return `<option value="${s}" ${s===st.to?"selected":""}>${s>=SLOTS?"24:00":fmtSlot(s)}</option>`; }).join("");
  const regionSeg = cfg.hasRegion ? `
    <div class="filter-group">
      <span class="filter-label">区域</span>
      <div class="seg" id="regionSeg">
        <button data-r="全区域" class="${st.region==="全区域"?"on":""}">全区域</button>
        ${REGIONS.map(r=>`<button data-r="${r}" class="${st.region===r?"on":""}">${r}</button>`).join("")}
      </div>
    </div>` : "";
  return `
    <div class="filter-group">
      <span class="filter-label">日期</span>
      <input type="date" id="fDate" value="${st.date}">
    </div>
    <div class="filter-group">

function bindFilterEvents(m, st, redraw){
  document.getElementById("fDate").onchange = e => { st.date = e.target.value; redraw(); };
  const fFrom = document.getElementById("fFrom"), fTo = document.getElementById("fTo");
  fFrom.onchange = e => { st.from = +e.target.value; if(st.to <= st.from){ st.to = Math.min(st.from + 1, SLOTS); fTo.value = st.to; } redraw(); };
  fTo.onchange = e => { st.to = +e.target.value; if(st.to <= st.from){ st.from = Math.max(st.to - 1, 0); fFrom.value = st.from; } redraw(); };
  const seg = document.getElementById("regionSeg");
  if(seg) seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    st.region = b.dataset.r;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    redraw();
  });
  document.getElementById("exportBtn").onclick = () => exportExcel(m);
}

function drawRealtime(){
  const st = getState("realtime");
  const wrap = document.getElementById("rtWrap");
  if(!RAW[st.date]){ wrap.innerHTML = `<div class="empty">所选日期暂无数据</div>`; return; }

  const regions = st.region === "全区域" ? REGIONS : [st.region];
  const fromMin = st.from * 30, toMin = Math.min(st.to * 30, 24 * 60);
  const lastMin = lastDataMinute(st.date);

  /* 历史数据：每次上报的实时人数准确值 */
  let histRows = [];
  regions.forEach(rg => {
    let count = 0;
    RAW[st.date].realtime[rg].forEach(e => {
      count = Math.max(0, count + e.delta);
      const t = e.h * 60 + e.min;
      if(t >= fromMin && t < toMin)
        histRows.push({ t: fmtHM(e.h, e.min), rg, value: count });
    });
  });
  histRows.sort((a,b) => a.t.localeCompare(b.t));

  /* 小时最高：与所选半小时区间重叠的小时，按重叠分钟取最高值 */
  let hourRows = [];
  regions.forEach(rg => {
    for(let h = 0; h < HOURS; h++){
      const sMin = Math.max(h * 60, fromMin), eMin = Math.min(h * 60 + 60, toMin);
      if(sMin >= eMin) continue;
      hourRows.push({ label: `${fmtHM((sMin/60)|0, sMin%60)} – ${fmtHM(((eMin-1)/60)|0, (eMin-1)%60)}`, rg,
        max: (eMin - 1) <= lastMin ? rtRangeMax(st.date, rg, sMin, eMin) : null });
    }
  });

  /* 汇总（实时人数任何展示均封顶 10+） */
  const cur = rtCurrent(st.date, st.region);
  const todayPeak = rtRangeMax(st.date, st.region, 0, lastMin + 1);
  const rangePeak = rtRangeMax(st.date, st.region, fromMin, Math.min(toMin, lastMin + 1));
  const now = new Date();
  const summaryHtml = `
    <div class="sum-item"><div class="k">所选时段（${st.date}）</div><div class="v" style="font-size:16px">${spanLabel(st.from, st.to)}</div></div>
    <div class="sum-item"><div class="k">当前实时人数（${st.date === todayKey() ? fmtHM(now.getHours(), now.getMinutes()) : "末日时刻"}）</div><div class="v">${fmtRT(cur)}<small>人</small></div></div>
    <div class="sum-item"><div class="k">当日最高实时人数</div><div class="v">${fmtRT(todayPeak)}<small>人</small></div></div>
    <div class="sum-item"><div class="k">所选时段最高</div><div class="v">${fmtRT(rangePeak)}<small>人</small></div></div>
    <div class="sum-item"><div class="k">区域</div><div class="v" style="font-size:16px">${st.region}</div></div>`;

  /* Tab：小时最高在前（默认），历史数据在后 */
  const isHour = st.tab !== "hist";
  const tabsHtml = `
    <div class="tabs" id="rtTabs">
      <button data-tab="hour" class="${isHour ? "on" : ""}">小时最高实时人数</button>
      <button data-tab="hist" class="${!isHour ? "on" : ""}">历史数据<span class="cnt">${histRows.length} 条上报</span></button>
    </div>`;

  let tableHtml;
  if(isHour){
    const hourBody = hourRows.map(r => `<tr>
        <td>${r.label}</td><td>${r.rg}</td>
        <td><strong>${r.max == null ? "—" : fmtRT(r.max)}</strong></td></tr>`).join("");
    tableHtml = `<table><thead><tr><th>时间段</th><th>区域</th><th>小时最高实时人数（人）</th></tr></thead>
      <tbody>${hourBody}</tbody></table>`;
  }else{
    const histBody = histRows.length
      ? histRows.map(r => `<tr>
          <td>${r.t}</td><td>${r.rg}</td>
          <td><strong>${fmtRT(r.value)}</strong></td></tr>`).join("")
      : `<tr><td colspan="3" style="text-align:center;color:var(--ink-3)">所选时段内无上报记录</td></tr>`;
    tableHtml = `<table><thead><tr><th>时间</th><th>区域</th><th>实时人数（人）</th></tr></thead>
      <tbody>${histBody}</tbody></table>`;
  }

  wrap.innerHTML = `<div class="summary">${summaryHtml}</div>${tabsHtml}${tableHtml}`;

  document.getElementById("rtTabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    st.tab = b.dataset.tab;
    drawRealtime();
  });
}

function dwellRegionSeg(st){
  return `<div class="filter-group">
    <span class="filter-label">区域</span>
    <div class="seg" id="regionSeg">
      <button data-r="全区域" class="${st.region==="全区域"?"on":""}">全区域</button>
      ${REGIONS.map(r=>`<button data-r="${r}" class="${st.region===r?"on":""}">${r}</button>`).join("")}
    </div>
  </div>`;

/* 全天总量：Σ(实时人数 × 持续时长) ÷ 访问人次（历史日期即全天固定值） */
function dwellDayTotal(dateKey, region){
  const tl = rtTimelines(dateKey)[region];
  const vArr = series(dateKey, "visits", region);
  const lastMin = lastDataMinute(dateKey);
  let personMin = 0;
  for(let m = 0; m <= lastMin; m++) personMin += tl[m];
  const visits = sumArr(vArr);
  return { visits, personMin, avg: visits ? +(personMin / visits).toFixed(1) : 0 };
}

/* 分时累计：从 0 点起逐半小时累计（当天截至当前时刻，历史日期为完整天） */
function dwellCumRows(dateKey, region){
  const tl = rtTimelines(dateKey)[region];
  const vArr = series(dateKey, "visits", region);
  const lastMin = lastDataMinute(dateKey);        // 数据覆盖到的最后一分钟（含）
  const nowSlot = Math.floor(lastMin / 30);       // 当前所在的半小时槽
  const rows = [];
  let cumV = 0, cumMin = 0;
  for(let s = 0; s <= nowSlot; s++){
    cumV += vArr[s];
    const endMin = Math.min(s * 30 + 30, lastMin + 1);
    for(let m = s * 30; m < endMin; m++) cumMin += tl[m];
    const partial = endMin < s * 30 + 30;
    rows.push({ label: partial ? `${fmtSlot(s)} – ${fmtHM(((endMin-1)/60)|0, (endMin-1)%60)}` : slotLabel(s),
      visits: cumV, personMin: cumMin, avg: cumV ? +(cumMin / cumV).toFixed(1) : 0 });
  }
  return rows;
}

/* 分时累计明细（折叠展示） */
function dwellDetailHTML(rows){
  return `<details class="dwell-detail">
    <summary><span>分时累计明细（每半小时）</span><span class="hint">共 ${rows.length} 行，点击展开 ＋</span></summary>
    <table><thead><tr><th>时间段</th><th>时段访问人次（人次）</th><th>时段累计驻留（人·分钟）</th><th>平均驻留时长（分钟）</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${r.label}</td><td>${r.visits}</td><td>${r.personMin}</td>
      <td><strong>${(+r.avg).toFixed(1)}</strong></td></tr>`).join("")}</tbody></table>
  </details>`;
}

/* 历史：各日期全天固定值矩阵 */
function dwellHistMatrix(){
  return Object.keys(RAW).sort().map(d => {
    const row = { date: d };
    REGIONS.forEach(r => row[r] = RAW[d].dwell[r].avg);
    const allV = sumArr(REGIONS.map(r => RAW[d].dwell[r].visits));
    const allMin = sumArr(REGIONS.map(r => RAW[d].dwell[r].personMin));
    row["全区域"] = allV ? +(allMin / allV).toFixed(1) : 0;
    return row;
  });
}

/* 单区域逐日趋势折线图（纯 SVG，无第三方依赖） */
function dwellChart(dates, values){
  const W = 780, H = 230, PL = 46, PR = 20, PT = 20, PB = 32;
  const top = Math.ceil(Math.max(...values, 1) * 1.25);
  const x = i => PL + (W - PL - PR) * (dates.length === 1 ? 0.5 : i / (dates.length - 1));
  const y = v => PT + (H - PT - PB) * (1 - v / top);
  let grid = "";
  for(let g = 0; g <= 4; g++){
    const gv = top * g / 4, gy = y(gv);
    grid += `<line x1="${PL}" y1="${gy}" x2="${W-PR}" y2="${gy}" stroke="#f0f1f5"/>
             <text x="${PL-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="#9a9eac">${gv.toFixed(1)}</text>`;
  }
  const pts = values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const dots = values.map((v,i)=>`
    <circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#12141f"/>
    <text x="${x(i)}" y="${y(v)-9}" text-anchor="middle" font-size="11" font-weight="600" fill="#12141f">${v.toFixed(1)}</text>
    <text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#9a9eac">${dates[i].slice(5)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;border:1px solid var(--line);background:#fff">
    ${grid}
    <polyline points="${pts}" fill="none" stroke="#12141f" stroke-width="2"/>
    ${dots}
  </svg>`;
}

  const cfg = METRICS.dwell, st = getState("dwell");

  let filtersHtml, summaryHtml, bodyHtml;

  if(isZone){
    /* 分区统计：可选日期，不支持时间段 */

      const d = document.getElementById("dwDate");
      if(d) d.onchange = e => { st.date = e.target.value; drawDwell(); };
      return;
    }

    const detailRows = dwellCumRows(dateKey, st.region);
    const last = detailRows[detailRows.length - 1] || { visits: 0, personMin: 0, avg: 0 };

    if(isToday){
      /* 当天：只显示当前累计数据 + 折叠的分时明细 */
      summaryHtml = `
        <div class="sum-item"><div class="k">统计日期</div><div class="v" style="font-size:16px">${todayKey()}</div></div>
        <div class="sum-item"><div class="k">累计更新至</div><div class="v" style="font-size:16px">${nowStr}（每半小时更新）</div></div>

      bodyHtml = dwellDetailHTML(detailRows);
    }else{
      /* 历史日期：各区域全天固定值总览 + 折叠的分时明细 */
      const overview = [...REGIONS, "全区域"].map(rg => ({ rg, ...dwellDayTotal(dateKey, rg) }));
      const all = overview[overview.length - 1];
      summaryHtml = `
        <div class="sum-item"><div class="k">所选日期</div><div class="v" style="font-size:16px">${dateKey}</div></div>
        <div class="sum-item"><div class="k">数据口径</div><div class="v" style="font-size:16px">全天固定值</div></div>
        <div class="sum-item"><div class="k">全天平均驻留时长（全区域）</div><div class="v">${(+all.avg).toFixed(1)}<small>分钟</small></div></div>`;
      bodyHtml = `
        <table><thead><tr><th>区域</th><th>访问人次（人次）</th><th>累计驻留（人·分钟）</th><th>平均驻留时长（分钟）</th></tr></thead>

        ${dwellDetailHTML(detailRows)}`;
    }
  }else{
    /* 历史对比：可选区域，逐日变化图表 + 日期倒序矩阵表 */
    const datesAsc = Object.keys(RAW).sort();
    const matrix = dwellHistMatrix().sort((a,b) => b.date.localeCompare(a.date)); // 近 → 远
    const regionCols = [...REGIONS, "全区域"];
    const colIdx = regionCols.indexOf(st.region);
    const ascMatrix = dwellHistMatrix();
    const chartValues = datesAsc.map(d => +(ascMatrix.find(r => r.date === d)[st.region]));
    const avgAll = chartValues.length ? sumArr(chartValues) / chartValues.length : 0;
    filtersHtml = `<div class="filters">${dwellRegionSeg(st)}<button class="export-btn" id="exportBtn">导出 Excel</button></div>`;
    summaryHtml = `
      <div class="sum-item"><div class="k">所选区域</div><div class="v" style="font-size:16px">${st.region}</div></div>
      <div class="sum-item"><div class="k">日期范围</div><div class="v" style="font-size:16px">${datesAsc[0]} ~ ${datesAsc[datesAsc.length-1]}</div></div>
      <div class="sum-item"><div class="k">近 ${datesAsc.length} 天平均</div><div class="v">${avgAll.toFixed(1)}<small>分钟</small></div></div>`;
    bodyHtml = dwellChart(datesAsc, chartValues) + `
      <div style="margin:24px 0 12px;font-size:15px;font-weight:600">各日期 · 各区域平均驻留时长（分钟）<span style="font-weight:400;font-size:12px;color:var(--ink-3);margin-left:8px">按日期近 → 远排序</span></div>

      <tbody>${matrix.map(r => `<tr>
        <td>${r.date}${r.date === todayKey() ? "（今天，截至当前）" : ""}</td>

  }

  wrap.innerHTML = `<div class="summary">${summaryHtml}</div>${tabsHtml}${filtersHtml}${bodyHtml}`;
  bindDwellCommon(st);

function renderGeneric(m){
  const cfg = METRICS[m], st = getState(m);

  bindFilterEvents(m, st, () => drawTable(m));
  drawTable(m);

function buildRows(m){
  const cfg = METRICS[m], st = getState(m);
  const regions = (cfg.hasRegion && st.region !== "全区域") ? [st.region]
    : (cfg.hasRegion ? ["全区域"] : [null]);
  const rows = [];
  regions.forEach(rg => {
    const s = series(st.date, m, rg || "全区域");
    let cum = 0;
    for(let sl = st.from; sl < st.to; sl++){
      const inc = s[sl];
      cum += inc;
      rows.push({ label: slotLabel(sl), region: rg,
        inc: +inc.toFixed(cfg.precision), cum: +cum.toFixed(cfg.precision) });
    }
  });
  return rows;
}

function drawTable(m){
  const cfg = METRICS[m], st = getState(m);
  const wrap = document.getElementById("tableWrap");
  if(!RAW[st.date]){ wrap.innerHTML = `<div class="empty">所选日期暂无数据</div>`; return; }
  const rows = buildRows(m);

  const thead = `<tr>${cfg.cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
  const body = rows.map(r => {
    let tds = `<td>${r.label}</td>`;
    if(cfg.hasRegion) tds += `<td>${r.region}</td>`;
    tds += `<td class="delta">+${fmtNum(r.inc, cfg.precision)}</td><td><strong>${fmtNum(r.cum, cfg.precision)}</strong></td>`;
    return `<tr>${tds}</tr>`;
  }).join("");

  const totInc = rows.reduce((s,r)=>s + r.inc, 0);
  const lastCum = rows.length ? rows[rows.length-1].cum : 0;
  let summaryHtml = `
    <div class="sum-item"><div class="k">所选时段（${st.date}）</div><div class="v" style="font-size:16px">${spanLabel(st.from, st.to)}</div></div>
    <div class="sum-item"><div class="k">时段增量合计</div><div class="v">+${fmtNum(totInc, cfg.precision)}<small>${cfg.unit}</small></div></div>
    <div class="sum-item"><div class="k">时段末累计</div><div class="v">${fmtNum(lastCum, cfg.precision)}<small>${cfg.unit}</small></div></div>`;
  if(cfg.hasRegion) summaryHtml += `<div class="sum-item"><div class="k">区域</div><div class="v" style="font-size:16px">${st.region}</div></div>`;

  wrap.innerHTML = `<div class="summary">${summaryHtml}</div>
    <table><thead>${thead}</thead><tbody>${body}</tbody></table>`;
}

/* ---------- 导出 Excel ---------- */
function exportExcel(m){
  const cfg = METRICS[m];
  const wb = XLSX.utils.book_new();
  const st = getState(m);
  if(!RAW[st.date]){ alert("所选日期暂无数据"); return; }

  if(m === "realtime"){
    const regions = st.region === "全区域" ? REGIONS : [st.region];
    const fromMin = st.from * 30, toMin = Math.min(st.to * 30, 24 * 60);
    const lastMin = lastDataMinute(st.date);
    /* sheet 1：小时最高人数 */
    const hourRows = [];
    regions.forEach(rg => {
      for(let h = 0; h < HOURS; h++){
        const sMin = Math.max(h * 60, fromMin), eMin = Math.min(h * 60 + 60, toMin);
        if(sMin >= eMin) continue;
        hourRows.push([`${fmtHM((sMin/60)|0, sMin%60)} – ${fmtHM(((eMin-1)/60)|0, (eMin-1)%60)}`, rg,
          (eMin - 1) <= lastMin ? fmtRT(rtRangeMax(st.date, rg, sMin, eMin)) : "—"]);
      }
    });
    const ws1 = XLSX.utils.aoa_to_sheet([["时间段","区域","小时最高实时人数（人）"], ...hourRows]);
    ws1["!cols"] = [{wch:18},{wch:10},{wch:20}];
    XLSX.utils.book_append_sheet(wb, ws1, "小时最高人数");
    /* sheet 2：历史数据（每次上报的实时人数准确值） */
    let histRows = [];
    regions.forEach(rg => {
      let count = 0;
      RAW[st.date].realtime[rg].forEach(e => {
        count = Math.max(0, count + e.delta);
        const t = e.h * 60 + e.min;
        if(t >= fromMin && t < toMin) histRows.push([fmtHM(e.h, e.min), rg, fmtRT(count)]);
      });
    });
    histRows.sort((a,b) => a[0].localeCompare(b[0]));
    const ws2 = XLSX.utils.aoa_to_sheet([["时间","区域","实时人数（人）"], ...histRows]);
    ws2["!cols"] = [{wch:10},{wch:10},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws2, "历史数据");
    XLSX.writeFile(wb, `AqaraStudio_${cfg.name}_${st.date}_${spanLabel(st.from, st.to)}_${st.region}.xlsx`);
    return;
  }

  if(m === "dwell"){
    const isZone = st.tab !== "hist";
    if(isZone){
      const dateKey = st.date;
      if(!RAW[dateKey]){ alert("所选日期暂无数据"); return; }
      if(dateKey === todayKey()){
        /* 当天：分时累计 */
        const rows = dwellCumRows(dateKey, st.region);
        const data = [["时间段","时段访问人次（人次）","时段累计驻留（人·分钟）","平均驻留时长（分钟）"]];
        rows.forEach(r => data.push([r.label, r.visits, r.personMin, (+r.avg).toFixed(1)]));
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws["!cols"] = [{wch:18},{wch:22},{wch:26},{wch:22}];
        XLSX.utils.book_append_sheet(wb, ws, "当天分时累计");
        XLSX.writeFile(wb, `AqaraStudio_${cfg.name}_${dateKey}_当天_${st.region}.xlsx`);
      }else{
        /* 历史日期：全天总览 + 分时累计 */
        const overview = [...REGIONS, "全区域"].map(rg => ({ rg, ...dwellDayTotal(dateKey, rg) }));
        const data1 = [["区域","访问人次（人次）","累计驻留（人·分钟）","平均驻留时长（分钟）"]];
        overview.forEach(r => data1.push([r.rg, r.visits, r.personMin, (+r.avg).toFixed(1)]));
        const ws1 = XLSX.utils.aoa_to_sheet(data1);
        ws1["!cols"] = [{wch:10},{wch:20},{wch:24},{wch:22}];
        XLSX.utils.book_append_sheet(wb, ws1, "全天总览");
        const rows = dwellCumRows(dateKey, st.region);
        const data2 = [["时间段","时段访问人次（人次）","时段累计驻留（人·分钟）","平均驻留时长（分钟）"]];
        rows.forEach(r => data2.push([r.label, r.visits, r.personMin, (+r.avg).toFixed(1)]));
        const ws2 = XLSX.utils.aoa_to_sheet(data2);
        ws2["!cols"] = [{wch:18},{wch:22},{wch:26},{wch:22}];
        XLSX.utils.book_append_sheet(wb, ws2, "分时累计");
        XLSX.writeFile(wb, `AqaraStudio_${cfg.name}_${dateKey}_全天_${st.region}.xlsx`);
      }
    }else{
      /* 历史对比：矩阵（近 → 远） */
      const regionCols = [...REGIONS, "全区域"];
      const matrix = dwellHistMatrix().sort((a,b) => b.date.localeCompare(a.date));
      const data = [["日期", ...regionCols.map(c => c + "（分钟）")]];
      matrix.forEach(r => data.push([r.date + (r.date === todayKey() ? "（截至当前）" : ""), ...regionCols.map(c => (+r[c]).toFixed(1))]));
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!cols"] = [{wch:16}, ...regionCols.map(()=>({wch:12}))];
      XLSX.utils.book_append_sheet(wb, ws, "历史对比");
      XLSX.writeFile(wb, `AqaraStudio_${cfg.name}_历史对比_${st.region}.xlsx`);
    }
    return;
  }

  const rows = buildRows(m);
  const data = [cfg.cols];
  rows.forEach(r => {
    const row = [r.label];
    if(cfg.hasRegion) row.push(r.region);
    row.push(r.inc, r.cum);
    data.push(row);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = cfg.cols.map(()=>({wch:18}));
  XLSX.utils.book_append_sheet(wb, ws, cfg.name);
  const rg = cfg.hasRegion ? "_" + st.region : "";
  XLSX.writeFile(wb, `AqaraStudio_${cfg.name}_${st.date}_${spanLabel(st.from, st.to)}${rg}.xlsx`);
}

render();
</script>
</body>
</html>
