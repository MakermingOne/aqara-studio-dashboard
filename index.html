  function mountBrand(container, footer) {
    try {

      capsule.style.display = 'inline-flex';
      capsule.style.alignItems = 'center';

        capsule.style.width = '104px';

      host.style.setProperty('align-items', 'center', 'important');
      host.style.setProperty('gap', '4px', 'important');

  // --- banner (adapts to page theme) ---

<style>
  :root{
    --bg:#ffffff;

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

  a{color:inherit;text-decoration:none;}

  /* ---------- header ---------- */

<header>
  <div class="brand"><a href="#/">Aqara Studio</a></div>
  <div class="crumb" id="crumb"></div>
  <div class="header-right">
    <span class="dev-pick"><label>选择设备</label><select id="devSel"></select></span>
    <span class="mode-chip" id="modeChip" title="返回首页"></span>
    <span class="status-chip" id="statusChip"></span>

    <button class="refresh-btn" id="refreshBtn">刷新</button>
  </div>

<main id="app"></main>
<div id="tip"></div>

<script>
/* =========================================================
 * 设备与统计规则（对应 PRD《Aqara Studio 传感器品类功能 · 数据统计类功能》）
 *  · 数据看板可含多个设备，本期不做多设备数据融合，切换设备单独查看
 * ========================================================= */
const RT_CAP = 10;         // 单设备实时人数侦测上限（雷达可追踪目标数），超过显示 10+
const SLOTS = 48;          // 设备半小时粒度上报
const DAYS = 30;           // 自定义时间段最大支持 30 天
const COLOR = { blue:"#3B82F6", green:"#10B981", amber:"#F59E0B", violet:"#8B5CF6", teal:"#0D9488", cyan:"#0891B2", pink:"#DB2777" };

const COPY = {
  offlineCalib: "检测到设备曾经出现离线，有可能导致统计数据偏差，建议进行校准后使用。",
  capNote: "单设备雷达同时侦测目标上限 10 人，任何区域及区域合计超过 10 时显示 10+。",
  staticNote: "页面内数据为静态数据，点击「刷新」获取设备最新上报值；多设备暂不做数据融合。",
  modeNote: {
    presence: "存在监测模式下可同时进行实时人数、访问人次、平均驻留时长与行走距离统计；一台设备同一时间只运行一种工作模式。",
    entrance: "进出口人流统计为独立工作模式，开启后禁用其他监测功能，相关功能点不再显示、相关自动化失效；切换工作模式需在设备功能页确认，本看板按设备当前模式展示对应数据。",
  },
};

/* 空间作息画像：profile(h) = 某时刻一人在该空间的概率；weights(h) = 8 个自定义区域的分布权重
   每台设备统一为「区域 1 ~ 区域 8」共 8 个自定义区域，所有统计指标的区域维度一致
   两台设备分别承载两种工作模式（一台设备同一时间只能运行一种模式） */
const ZONES8 = Array.from({length:8}, (_,i) => "区域 " + (i+1));
const DEVICES = [
  {
    id:"presence", name:"FP400 Pro（存在监测）", space:"客厅", household:3, seed:11001, allowGuests:true,
    regions:ZONES8.slice(),
    offlineDays:[ "2026-10-12" ],          // 该日无数据 → 报表显示 “-”
    profile(h){ if(h<6) return .04; if(h<8) return .45; if(h<11) return .28; if(h<13) return .55;
      if(h<17) return .3; if(h<19) return .58; if(h<23) return .82; return .3 },
    weights(h){
      const w = [.28,.2,.12,.1,.08,.08,.08,.06];
      if(h>=6&&h<9){ w[2]=.34; w[0]=.16; }          // 早餐时段集中在区域 3
      if(h>=11&&h<14){ w[2]=.4; w[0]=.14; }
      if(h>=17&&h<20){ w[2]=.36; w[0]=.18; }
      if(h>=20){ w[0]=.42; w[1]=.3; w[2]=.06; }     // 晚间集中在区域 1 / 2
      return w;
    },
    state:{ mode:"presence", window:{on:true,start:0,end:24*60-1}, calib:null, prompted:false },
  },
  {
    id:"entrance", name:"FP400 Pro（进出口人流统计）", space:"入户动线", household:3, seed:44004,
    regions:ZONES8.slice(),
    offlineRecent:true,                    // 近期出现过离线 → 进入页面提示校准
    profile(h){ if(h<6) return .005; if(h<9) return .13; if(h<12) return .02; if(h<13) return .07;
      if(h<17) return .02; if(h<20) return .15; if(h<23) return .08; return .02 },
    weights(h){ return [.52,.28,.06,.04,.02,.02,.03,.03] },
    quick:true,                            // 过场动线，停留时长以分钟计
    entryZone:{ name:"进出口" },            // 进出口就是一个区域名称，仅 1 个，在地图中圈定
    state:{ mode:"entrance", window:{on:true,start:7*60,end:23*60}, calib:null, prompted:false },
  },
];
function devState(dev){ return dev.state; }
let CUR = DEVICES[0];
let DEVICE = CUR.state;
let REGIONS = CUR.regions;
let DEVICE_NAME = CUR.name;
const RAWMAP = {};
let RAW = {};

/* =========================================================
 * 模拟数据：按「人 × 分钟」推演，各子区域人数之和恒等于该空间实时总人数
 * ========================================================= */
function seededRand(seed){ let s = seed % 2147483647; if(s <= 0) s += 233280; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function pickWeighted(list, w, rnd){
  const tot = w.reduce((a,b)=>a+b,0); let x = rnd()*tot;
  for(let i=0;i<list.length;i++){ x -= w[i]; if(x <= 0) return list[i]; }
  return list[list.length-1];
}
function fmtDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return fmtDate(new Date()); }
function nowMinute(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function covFor(dev, key){
  if(key !== todayKey()) return 24*60 - 1;
  const m = nowMinute();
  return (dev.offlineNow && dev.offlineNow.truncMin) ? Math.max(0, m - dev.offlineNow.truncMin) : m;
}
function personSegs(dev, rnd, guest){
  const segs = [];
  const minDur = dev.quick ? 1 : 12, maxDur = dev.quick ? 5 : 80;
  let t = guest ? 15*60 + Math.floor(rnd()*30) : 0;
  const tend = guest ? 19*60 + Math.floor(rnd()*80) : 1440;
  while(t < tend){
    const dur = Math.min(minDur + Math.floor(rnd()*(maxDur-minDur+1)), tend - t);
    const h = (t + dur/2) / 60;
    const p = guest ? .96 : dev.profile(h);
    let loc = null;
    if(rnd() < p) loc = pickWeighted(dev.regions, dev.weights(h), rnd);
    segs.push({ s:t, e:t+dur, loc });
    t += dur;
  }
  return segs;
}
function locAt(segs, m){
  for(let i=0;i<segs.length;i++){ if(m >= segs[i].s && m < segs[i].e) return segs[i].loc; }
  return null;
}
function genDeviceDay(dev, key){
  if(dev.offlineDays && dev.offlineDays.indexOf(key) >= 0) return { offline:true };
  const isToday = key === todayKey();
  const cov = covFor(dev, key);
  const rnd = seededRand(parseInt(key.replace(/-/g,""),10) * 7 + dev.seed + (isToday ? new Date().getSeconds() : 0));
  const guest = dev.allowGuests && rnd() < .12;
  const segs = [];
  for(let i = 0; i < dev.household; i++) segs.push(personSegs(dev, rnd, false));
  if(guest) for(let i = 0; i < 8 + Math.floor(rnd()*4); i++) segs.push(personSegs(dev, rnd, true));

  const statCov = isToday ? Math.floor(cov / 30) * 30 : 24 * 60;   // 统计口径：只计入已完成的半小时
  /* 设备按毫秒级变化实时上报：这里生成“秒级上报事件”，一秒内允许多条 */
  const day = { offline:false, cov, statCov, guestDay:!!guest,
    rtEvents:{},                     // 区域实时人数上报：{t:秒, v:该区域当下实际人数, d:变化量}
    entEvents:[],                    // 进出口进出上报：{t:秒, dir:"in"|"out", d:人次, occ:变化后在场人数}
    visits:{}, distance:new Array(SLOTS).fill(0), enter:new Array(SLOTS).fill(0), exit:new Array(SLOTS).fill(0) };
  dev.regions.forEach(r => { day.rtEvents[r] = []; day.visits[r] = new Array(SLOTS).fill(0); });
  const cnt = {}, last = new Array(segs.length).fill(null);
  dev.regions.forEach(r => cnt[r] = 0);
  let home = 0;
  const atSec = m => m * 60 + Math.floor(rnd()*60);            // 该分钟内的随机上报时刻
  const atMs = () => Math.floor(rnd()*1000);                       // 毫秒偏移（一秒内可多条，时刻精确到秒）
  const pushRt = (r, tSec, d) => {
    const v = cnt[r] + d; cnt[r] = v;
    day.rtEvents[r].push({ t:tSec, ms:atMs(), v: Math.min(RT_CAP, v), d });   // 侦测上限 10 人，上报值截断
  };
  for(let m = 0; m <= cov; m++){
    const nextCnt = {};
    dev.regions.forEach(r => nextCnt[r] = cnt[r]);
    let nextHome = 0;
    for(let i = 0; i < segs.length; i++){
      const loc = locAt(segs[i], m);
      if(loc) nextHome++;
      let stepM = 0;
      if(m > 0 && loc && last[i] !== null && last[i] !== undefined && loc !== last[i]) stepM = Math.round(6 + rnd()*16);
      else if(m > 0 && loc && (last[i] === null || last[i] === undefined)) stepM = Math.round(3 + rnd()*8);
      if(stepM) day.distance[Math.min(SLOTS-1, (m/30)|0)] += stepM;
      last[i] = loc;
    }
    dev.regions.forEach(r => {
      const cur = dev.regions.indexOf(r) === 0 ? null : null;
      const before = cnt[r];
      let after = 0; for(let i = 0; i < segs.length; i++) if(locAt(segs[i], m) === r) after++;
      if(after !== before) pushRt(r, atSec(m), after - before);
      if(after !== before && m > 0) day.visits[r][Math.min(SLOTS-1, (m/30)|0)] += Math.max(0, after - before);
    });
    if(nextHome !== home){
      const tSec = atSec(m), d = nextHome - home;
      day.entEvents.push({ t:tSec, ms:atMs(), dir:d > 0 ? "in" : "out", d:Math.abs(d), occ:nextHome });
      const slot = Math.min(SLOTS-1, (m/30)|0);
      if(d > 0) day.enter[slot] += d; else day.exit[slot] += -d;
      home = nextHome;
    }
  }
  return day;
}
function genData(){
  DEVICES.forEach(dev => {
    const map = {};
    for(let d = DAYS - 1; d >= 0; d--){ const dt = new Date(); dt.setDate(dt.getDate() - d); map[fmtDate(dt)] = genDeviceDay(dev, fmtDate(dt)); }
    RAWMAP[dev.id] = map;
  });
  useDevice(CUR.id);
}
function useDevice(id){
  CUR = DEVICES.find(d => d.id === id) || DEVICES[0];
  DEVICE = CUR.state; REGIONS = CUR.regions; DEVICE_NAME = CUR.name; RAW = RAWMAP[CUR.id] || {};
  Object.keys(evCache).forEach(k => delete evCache[k]);
}

/* =========================================================
 * 工具
 * ========================================================= */
function customOf(st){
  if(!st.custom){
    const d = RAW[todayKey()], n = new Date();
    const to = d && !d.offline ? stHalfEnd(d.statCov) : "23:30";
    st.custom = { fromDate: fmtDate(addDays(n, -2)), fromTime: "00:00", toDate: todayKey(), toTime: to };
    st.range = { from: st.custom.fromDate, to: st.custom.toDate };
  }
  return st.custom;
}
function timeMin(v){ const p = String(v || "00:00").split(":").map(Number); return (p[0] || 0) * 60 + (p[1] || 0); }
function isIntra(st){ return st.type === "hourly" || st.type === "custom"; }
function halfHours(){ const out = []; for(let m = 0; m < 24 * 60; m += 30) out.push(fmtHM((m / 60) | 0, m % 60)); return out; }
function customSpanLabel(st){
  const c = customOf(st);
  return c.fromDate + " " + c.fromTime + " – " + c.toDate + " " + c.toTime;
}
function parseDate(s){ const p = String(s).split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtHM(h, m){ return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0"); }
function fmtMin(t){ return fmtHM(Math.floor(t / 60) % 24, t % 60) + (t >= 24*60 ? "（次日）" : ""); }
function fmtMD(key){ const p = key.split("-"); return p[1] + "-" + p[2]; }
function fmtCN(key){ const p = key.split("-"); return Number(p[1]) + "月" + Number(p[2]) + "日"; }
function fmtCompact(key){ return key.replace(/-/g, ""); }
function sumArr(a){ return a.reduce((s,x)=>s+x,0); }
function fmtRT(n){ return n == null ? "—" : (n > RT_CAP ? "10+" : String(n)); }
function fmtNum(v, p){ return v == null ? "—" : (+v).toFixed(p == null ? 0 : p); }
function dayKeysInRange(a, b){
  const out = []; const end = parseDate(b);
  for(let d = parseDate(a); d <= end; d = addDays(d, 1)) out.push(fmtDate(d));
  return out;
}
function firstDayOfMonth(){ const n = new Date(); return fmtDate(new Date(n.getFullYear(), n.getMonth(), 1)); }
function lastDayOfMonth(){ const n = new Date(); return fmtDate(new Date(n.getFullYear(), n.getMonth()+1, 0)); }
function mondayOf(d){ const x = new Date(d); return addDays(x, -((x.getDay() + 6) % 7)); }
function availableMin(){ return fmtDate(addDays(new Date(), -(DAYS - 1))); }
function isOfflineDay(key){
  return !!RAW[key] && RAW[key].offline === true;
}
function deviceOfflineNow(){ return !!(CUR.offlineNow && CUR.offlineNow.truncMin); }
function currentMinute(){ const d = RAW[todayKey()]; return d && !d.offline ? d.cov : covFor(CUR, todayKey()); }

/* ---------- 时间桶（报表 X 轴） ----------
 * 日 → 小时级（实时人数支持 1 分钟 ~ 1 小时动态调整；进出口按统计时间段钳制首尾）
 * 按时 → 当天 24 小时，小时级；按日 / 按周 / 按月 / 自定义 → 天级
 */
function bucketSpec(st, m){
  const cfg = METRICS[m];
  if(st.type === "hourly"){
    const key = st.date;
    if(!RAW[key]) return null;
    if(RAW[key].offline) return { kind:"intraday", buckets:[], offline:true };
    let lo = 0, hi = 24 * 60;
    if(cfg.entranceWindow && DEVICE.window.on){ lo = DEVICE.window.start; hi = DEVICE.window.end + 1; }
    hi = Math.min(hi, RAW[key].statCov);
    const g = st.type === "custom" ? 30 : (cfg.granFixed || 60);
    const out = [];
    for(let s = lo; s < hi; s += g){ const e = Math.min(s + g, hi);
      out.push({ key, label: fmtMin(s) + " – " + fmtMin(e - 1), tick: fmtHM((s/60)|0, s%60), s, e }); }
    return { kind:"intraday", buckets: out, offline:false };
  }
  if(st.type === "custom"){
    const c = customOf(st), out = [];
    dayKeysInRange(c.fromDate, c.toDate).forEach(k => {
      const d = RAW[k];
      const lo = k === c.fromDate ? timeMin(c.fromTime) : 0;
      let hi = k === c.toDate ? timeMin(c.toTime) : 24 * 60;
      if(!d || d.offline){ out.push({ key:k, label: fmtMD(k) + " " + fmtHM((lo/60)|0, lo%60), s: lo, e: Math.max(hi, lo + 1), offline:true }); return; }
      hi = Math.min(hi, d.statCov);
      for(let x = lo; x < hi; x += 30){
        const e = Math.min(x + 30, hi);
        const firstOfDay = x === lo;
        out.push({ key: k, label: fmtMD(k) + " " + fmtHM((x / 60) | 0, x % 60) + " – " + fmtHM(((e - 1) / 60) | 0, (e - 1) % 60),
          tick: (firstOfDay ? fmtMD(k) + " " : "") + fmtHM((x / 60) | 0, x % 60), s: x, e });
      }
    });
    return { kind:"intraday", buckets: out, offline:false };
  }
  const buckets = dayKeysInRange(st.range.from, st.range.to).map(k => ({
    key: k, label: fmtMD(k), tick: fmtMD(k), s: 0, e: RAW[k] && !RAW[k].offline ? RAW[k].statCov : 24 * 60,
    offline: !RAW[k] || RAW[k].offline
  }));
  return { kind:"multiday", buckets, offline:false };
}
function bucketEndLabel(st, spec){
  if(!spec || !spec.buckets.length) return "所选区间无数据";
  if(spec.kind === "intraday"){
    const b = spec.buckets;
    return fmtMin(b[0].s) + " – " + fmtMin(b[b.length-1].e - 1);
  }
  return fmtCN(st.range.from) + " – " + fmtCN(st.range.to);
}

/* ---------- 指标取数 ---------- */
function incSeries(dateKey, metric, region){
  const day = RAW[dateKey];
  if(!day || day.offline) return new Array(SLOTS).fill(0);
  if(metric === "distance") return day.distance;
  if(metric === "enter") return day.enter;
  if(metric === "exit") return day.exit;
  if(metric === "visits"){
    if(region && region !== "全区域") return day.visits[region] || new Array(SLOTS).fill(0);
    const out = new Array(SLOTS).fill(0);                 // 全区域 = 各子区域合计
    REGIONS.forEach(r => (day.visits[r] || []).forEach((v,i) => out[i] += v));
    return out;
  }
  return new Array(SLOTS).fill(0);
}
function slotSpan(b){
  const from = b.e <= 1440 ? Math.floor((b.e - 1) / 30) : SLOTS - 1;
  return [Math.floor(b.s / 30), Math.max(from, Math.floor(b.s / 30))];
}
function incInBucket(b, metric, region){
  if(!RAW[b.key] || RAW[b.key].offline) return null;
  const s = incSeries(b.key, metric, region);
  const [i0, i1] = slotSpan(b);
  const lim = RAW[b.key].statCov;                       // 未完成的半小时不计入
  let t = 0; for(let i = i0; i <= i1 && i * 30 < lim; i++) t += s[i];
  return t;
}
/* 秒级上报事件的重放工具：所有实时人数、空间驻留人数都从事件序列推导 */
const evCache = {};
function cacheGet(k, build){ if(!(k in evCache)) evCache[k] = build(); return evCache[k]; }
function dayOf(dateKey){ const d = RAW[dateKey]; return d && !d.offline ? d : null; }
function rtEvList(dateKey, region){
  const d = dayOf(dateKey); if(!d) return null;
  return cacheGet(CUR.id + "|rt|" + dateKey + "|" + region, () => {
    if(region && region !== "全区域") return (d.rtEvents[region] || []).slice();
    const per = REGIONS.map(r => (d.rtEvents[r] || []));
    const cur = {}; REGIONS.forEach(r => cur[r] = 0);
    const all = [];
    const merged = [];
    per.forEach((list, i) => list.forEach(e => merged.push({ t:e.t, ms:e.ms, r:REGIONS[i], d:e.d })));
    merged.sort((a, b) => a.t - b.t);
    merged.forEach(e => {
      cur[e.r] += e.d;
      const total = REGIONS.reduce((s, r) => s + cur[r], 0);
      all.push({ t:e.t, ms:e.ms, v: Math.min(RT_CAP, total), d:e.d });   // 区域合计同样受 10 人上限约束
    });
    return all;
  });
}
function rtValAt(dateKey, region, sec){
  const list = rtEvList(dateKey, region); if(!list) return null;
  let v = 0;
  for(let i = 0; i < list.length; i++){ if(list[i].t > sec) break; v = list[i].v; }
  return v;
}
function rtAt(dateKey, region, minute){ return rtValAt(dateKey, region, minute * 60 + 59); }
function rtMax(b, region){
  const list = rtEvList(b.key, region); if(!list) return null;
  const s0 = b.s * 60, s1 = b.e * 60;
  let mx = rtValAt(b.key, region, s0);
  list.forEach(e => { if(e.t >= s0 && e.t < s1 && e.v > mx) mx = e.v; });
  return mx;
}
/* 区间内 Σ(实时人数 × 持续时长)，单位人·分钟 */
function rtPersonMin(dateKey, region, m0, m1){
  const list = rtEvList(dateKey, region); if(!list) return 0;
  const s0 = m0 * 60, s1 = m1 * 60;
  let v = 0;
  for(let i = 0; i < list.length; i++){ if(list[i].t < s0) v = list[i].v; else break; }
  let acc = 0, p = s0;
  list.forEach(e => {
    if(e.t <= s0) return;
    if(e.t >= s1) return;
    acc += v * (e.t - p); v = e.v; p = e.t;
  });
  acc += v * (s1 - p);
  return acc / 60;
}
function entEvList(dateKey){ const d = dayOf(dateKey); return d ? d.entEvents : null; }
function occRawAt(dateKey, minute){
  const list = entEvList(dateKey); if(!list) return null;
  const sec = minute * 60 + 59;
  let v = 0;
  for(let i = 0; i < list.length; i++){ if(list[i].t > sec) break; v = list[i].occ; }
  return v;
}
/* 校准偏移只作用于校准时刻之后，不回溯历史 */
function occAt(dateKey, minute){
  const raw = occRawAt(dateKey, minute);
  if(raw == null) return null;
  if(DEVICE.calib && dateKey === todayKey() && minute >= DEVICE.calib.atMin) return Math.max(0, raw + DEVICE.calib.offset);
  return raw;
}
function occMaxIn(b){
  const list = entEvList(b.key); if(!list) return null;
  const s0 = b.s * 60, s1 = b.e * 60;
  let mx = occAt(b.key, b.s);
  list.forEach(e => { if(e.t >= s0 && e.t < s1){ const v = occAt(b.key, Math.floor(e.t / 60)); if(v > mx) mx = v; } });
  return mx;
}
function dwellInBucket(b, region){
  const day = RAW[b.key];
  if(!day || day.offline) return null;
  const personMin = rtPersonMin(b.key, region, b.s, Math.min(b.e, day.statCov));
  const visits = incInBucket(b, "visits", region) || 0;
  return { visits, personMin: Math.round(personMin), avg: visits ? +(personMin / visits).toFixed(1) : null };
}

function stHalfEnd(mins){ const m = Math.max(0, Math.floor((mins - 1) / 30) * 30); return fmtHM((m / 60) | 0, m % 60); }
function syncCustomRange(st){ const c = st.custom; st.range = { from: c.fromDate, to: c.toDate }; }
function applyRangePreset(st, type){

/* 最近一个已完成半小时的上报值（各指标只引用自身口径） */
function lastSlotVal(dateKey, metric, region){
  const d = RAW[dateKey]; if(!d || d.offline) return null;
  const seq = incSeries(dateKey, metric, region);
  const i = Math.max(0, Math.min(SLOTS - 1, Math.floor((d.statCov - 1) / 30)));
  return seq[i];
}
/* 分钟级上报序列（0 表示该分钟无上报） */
function statCovOf(dateKey){ const d = RAW[dateKey]; return d && !d.offline ? d.statCov : 0; }
function daySlotsSum(dateKey, metric, region){
  const s = incSeries(dateKey, metric, region), lim = statCovOf(dateKey);
  let t = 0; for(let i = 0; i < SLOTS && i * 30 < lim; i++) t += s[i];
  return t;
}
function dayTotalVisits(dateKey, region){ return daySlotsSum(dateKey, "visits", region); }
function dayTotalPersonMin(dateKey, region){
  return Math.round(rtPersonMin(dateKey, region || "全区域", 0, statCovOf(dateKey)));
}

/* 当天：自 0:00 起逐半小时累计（dwellInBucket 已按 statCov 截断未完成的半小时，天然向下取整） */
function dwellCumRows(dateKey, region){

  const rows = []; let cv = 0, cm = 0;
  for(let s = 0; s + 30 <= day.statCov; s += 30){
    const d = dwellInBucket({ key: dateKey, s, e: s + 30 }, region);
    if(!d) continue;
    cv += d.visits; cm += d.personMin;
    rows.push({ label: fmtMin(s) + " – " + fmtMin(s + 29), inc: d.visits, cumV: cv, cumM: cm,
      avg: cv ? (cm / cv).toFixed(1) : null });
  }
  return rows;
}

/* 进出口·分时进出与驻留：秒级上报事件（一秒内可能多条），驻留人数为该时刻实际值 */
function entMinuteSeries(st){
  const out = { labels:[], ticks:[], inV:[], outV:[], occV:[], rows:[] };
  const spec = bucketSpec(st, "entrance");
  if(!spec) return out;
  const list = entEvList(st.date); if(!list) return out;
  const s0 = (DEVICE.window.on ? DEVICE.window.start : 0) * 60;
  const s1 = Math.min((DEVICE.window.on ? DEVICE.window.end + 1 : 24 * 60), statCovOf(st.date)) * 60;
  list.forEach(e => {
    if(e.t < s0 || e.t >= s1) return;
    const occ = occAt(st.date, Math.floor(e.t / 60));
    out.labels.push(fmtHMS(e.t));
    out.ticks.push(fmtHM(Math.floor(e.t/3600), Math.floor(e.t/60)%60));
    out.inV.push(e.dir === "in" ? e.d : 0);
    out.outV.push(e.dir === "out" ? e.d : 0);
    out.occV.push(occ);
    out.rows.push({ t: fmtHMS(e.t), dir: e.dir === "in" ? "进入" : "离开",
      d: "+" + e.d, occ: occ == null ? "—" : String(occ) });
  });
  return out;
}

function cumFrom(arr){ let c = 0; return arr.map(v => { if(v == null) return null; c += v; return c; }); }
/* 跨天清零：桶所属日期变化时累计重新起算 */
function cumByKey(buckets, arr){
  let c = 0, prev = null;
  return arr.map((v, i) => {
    if(buckets[i].key !== prev){ c = 0; prev = buckets[i].key; }
    if(v == null) return null;
    c += v; return c;
  });
}

function buildReport(m, st){
  const cfg = METRICS[m];
  if(m === "realtime" || m === "entrance") return null;
  const spec = bucketSpec(st, m);
  if(!spec) return null;
  const region = cfg.hasRegion ? st.region : null;
  const dayMode = isIntra(st);
  const tCol = st.type === "custom" ? "时间（半小时）" : (st.type === "hourly" ? "时间" : "日期");
  const notes = [], rows = [];
  const buckets = spec.buckets;
  const chart = { labels: buckets.map(b => b.label), ticks: buckets.map(b => b.tick || b.label), series: [] };
  if(!buckets.length || buckets.every(b => b.offline)) return null;
  const lastKey = buckets[buckets.length-1].key;

  if(m === "visits"){
    const inc = buckets.map(b => incInBucket(b, "visits", region));
    const cum = dayMode ? cumByKey(buckets, inc) : inc.slice();
    /* 天级下增量与当日累计为同一数值，只保留一个数值列 */
    const cols = dayMode ? [tCol, "区域", "增量人次", "累计人次"] : ["日期", "区域", "当日访问人次"];
    buckets.forEach((b, i) => rows.push({ cells: dayMode
      ? [{v:b.label},{v:region},{v: inc[i] == null ? "—" : "+" + inc[i], cls:"delta"},{v: cum[i] == null ? "—" : String(cum[i])}]
      : [{v:b.label},{v:region},{v: inc[i] == null ? "—" : String(inc[i])}] }));
    chart.series = dayMode ? [
      { name:"增量人次", color: COLOR.blue, type:"bar", data: inc, unit:" 人次" },
      { name:"累计人次", color: COLOR.violet, type:"line", data: cum, unit:" 人次", axis:"right" },
    ] : [
      { name:"当日访问人次", color: COLOR.blue, type:"bar", data: inc, unit:" 人次" },
    ];
    notes.push(cfg.formula);
    notes.push("按时视图按每小时统计，自定义视图按每半小时统计，按日 / 按周 / 按月视图颗粒度为天。");
    notes.push("跨天数据清零：时段视图的累计人次自所属日期统计起始时间滚动累加，天级每行为当日累计人次。");
    notes.push("导出时按区域拆分为子 sheet，包含全部 " + REGIONS.length + " 个区域及全区域合计。");
    return { cols, rows, chart, notes,
      summary:[
        {k:"统计区间", v: bucketEndLabel(st, spec), txt:true},
        {k:"区间访问人次合计", v: String(sumArr(inc.filter(x => x != null))), u:"人次"},
        {k: dayMode ? "截止当前累计" : "末日当日累计", v: String(cum[cum.length-1] || 0), u:"人次",
         x: dayMode ? fmtMin(buckets[buckets.length-1].e - 1) : lastKey},
        {k:"区域", v: region, txt:true},
      ] };
  }

  if(m === "dwell"){
    const cols = [tCol, "区域", "访问人次", "驻留时长（人·分钟）", "平均驻留时长（分钟）"];
    const data = buckets.map(b => dwellInBucket(b, region));
    const cumMin = [], cumVis = [];
    data.forEach(d => { cumMin.push(d ? d.personMin : null); cumVis.push(d ? d.visits : null); });
    buckets.forEach((b, i) => {
      const d = data[i];
      const avg = d ? (d.visits ? d.avg : null) : undefined;
      rows.push({ cells:[
        {v:b.label},{v:region},
        {v: d ? String(d.visits) : "—"},
        {v: d ? String(d.personMin) : "—", cls:"delta"},
        {v: d ? (avg == null ? "—" : avg.toFixed(1)) : "—", cls: d && avg == null ? "na" : ""}] });
    });
    /* 图表只呈现公式直接相关的两项：访问人次（柱）与驻留时长（柱），平均驻留时长用折线 */
    chart.series = [
      { name:"访问人次", color: COLOR.cyan, type:"bar", data: data.map(d => d ? d.visits : null), unit:" 人次" },
      { name:"驻留时长（人·分钟）", color: COLOR.violet, type:"bar", data: data.map(d => d ? d.personMin : null), unit:" 人·分钟", axis:"right" },
      { name:"平均驻留时长", color: COLOR.amber, type:"line", data: data.map(d => d && d.visits ? d.avg : null), unit:" 分钟", dec:1, axis:"right" },
    ];
    chart.axisNote = "左轴：访问人次（人次）｜右轴：驻留时长（人·分钟）· 平均驻留时长（分钟）";
    notes.push(cfg.formula);
    notes.push("名称统一：图与表中的「访问人次」「驻留时长（人·分钟）」「平均驻留时长（分钟）」为同一口径，驻留时长 = Σ(实时人数 × 该实时人数持续时长)，平均驻留时长 = 驻留时长 ÷ 访问人次。");
    notes.push("按时视图 X 轴颗粒度为 1 小时，自定义视图为 30 分钟，按日 / 按周 / 按月视图为天。");
    notes.push("跨天数据清零：每行展示该时段的驻留时长与访问人次，不做跨时段累计。");
    notes.push("导出时按区域拆分为子 sheet，包含全部 " + REGIONS.length + " 个区域及全区域合计。");
    const totVis = data.filter(d => d).reduce((s,d) => s + d.visits, 0);
    const totMin = data.filter(d => d).reduce((s,d) => s + d.personMin, 0);
    return { cols, rows, chart, notes,
      summary:[
        {k:"统计区间", v: bucketEndLabel(st, spec), txt:true},
        {k:"访问人次", v: String(totVis), u:"人次", x:"区间合计"},
        {k:"驻留时长（人·分钟）", v: String(totMin), x:"区间合计"},
        {k:"平均驻留时长", v: totVis ? (totMin / totVis).toFixed(1) : "—", u:"分钟", x:"区间合计"},
        {k:"区域", v: region, txt:true},
      ] };
  }

  /* 行走距离：仅全局，不分区域 */
  const dInc = buckets.map(b => incInBucket(b, "distance"));
  const dCum = dayMode ? cumFrom(dInc) : dInc.slice();
  const cols = dayMode ? [tCol, "增量行走距离（米）", "累计行走距离（米）"] : ["日期", "当日行走距离（米）"];
  buckets.forEach((b, i) => rows.push({ cells: dayMode
    ? [{v:b.label},{v: dInc[i] == null ? "—" : "+" + dInc[i], cls:"delta"},{v: dCum[i] == null ? "—" : String(dCum[i])}]
    : [{v:b.label},{v: dInc[i] == null ? "—" : String(dInc[i])}] }));
  chart.series = dayMode ? [
    { name:"增量行走距离", color: COLOR.teal, type:"bar", data: dInc, unit:" 米" },
    { name:"累计行走距离", color: COLOR.blue, type:"line", data: dCum, unit:" 米", axis:"right" },
  ] : [
    { name:"当日行走距离", color: COLOR.teal, type:"bar", data: dInc, unit:" 米" },
  ];
  notes.push(cfg.formula);
  notes.push("选择「日」时统计图 X 轴颗粒度固定为 1 小时，选择「周 / 月 / 自定义」时颗粒度为天。");
  notes.push("跨天数据清零；行走距离仅全局显示该数据，不分区域。");
  return { cols, rows, chart, notes,
    summary:[
      {k:"统计区间", v: bucketEndLabel(st, spec), txt:true},
      {k:"区间行走距离合计", v: String(sumArr(dInc.filter(x => x != null))), u:"米"},
      {k: dayMode ? "截止当前累计" : "末日当日行走距离", v: String(dCum[dCum.length-1] || 0), u:"米",
       x: dayMode ? fmtMin(buckets[buckets.length-1].e - 1) : lastKey},
    ] };
}

function liveRows(m){
  const key = todayKey(), cov = RAW[key] ? RAW[key].cov : 0;
  const lastReport = rg => {
    const ev = rtEvList(key, rg);
    if(ev && ev.length) return "最近上报 " + fmtHMS(ev[ev.length-1].t);

  const occ = occAt(key, cov), raw = occRawAt(key, cov);

      { k:"空间驻留人数（校准后）", v: occ == null ? "—" : String(occ), unit:"人", hero:true, sub:"=（累计进入 − 累计离开）+ 校准人数" },
      { k:"累计进入人次", v: String(daySlotsSum(key,"enter")), sub:"统计周期 " + (DEVICE.window.on ? fmtMin(DEVICE.window.start) + " – " + fmtMin(DEVICE.window.end) : "持续累计") },
      { k:"累计离开人次", v: String(daySlotsSum(key,"exit")), sub:"原始驻留 " + (raw == null ? "—" : raw) + " 人 · 校准偏差 " + (DEVICE.calib ? ((DEVICE.calib.offset>0?"+":"") + DEVICE.calib.offset) : "0") },
    ], note:"空间驻留人数由进出人次计算得到，最小值 0 不可为负；校准偏移仅作用于校准之后。" };

/* 分时人数：按上报逐条绘制，事件精确到秒（一秒内可能多条，全部绘制） */
function rtLogRows(st, spec, region){
  const rows = [];
  const multi = st.type !== "hourly";
  spec.buckets.forEach(b => {
    const list = rtEvList(b.key, region); if(!list) return;
    const s0 = b.s * 60, s1 = Math.min(b.e, statCovOf(b.key)) * 60;
    list.forEach(e => {
      if(e.t < s0 || e.t >= s1) return;
      rows.push({ sec:e.t, t:(multi ? fmtMD(b.key) + " " : "") + fmtHMS(e.t), v:e.v });
    });
  });
  rows.sort((a, b) => a.sec - b.sec);
  return rows;
}
function fmtHMS(sec){
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return fmtHM(h, m) + ":" + String(s).padStart(2,"0");
}
function rtReportSeries(st, spec, region){
  const rows = rtLogRows(st, spec, region);
  return { labels: rows.map(r => r.t), ticks: rows.map(r => fmtHM(Math.floor(r.sec/3600), Math.floor(r.sec/60)%60)), values: rows.map(r => r.v), secs: rows.map(r => r.sec) };
}
/* 统计值图：按时 → 每小时最大值；自定义 → 每半小时最大值；按日 / 周 / 月 → 每日最大值 */
function rtHourSeries(st, spec, region){
  let buckets = spec.buckets;
  if(st.type === "hourly"){
    const lim = statCovOf(st.date);
    buckets = [];
    for(let s = 0; s < lim; s += 60){
      const e = Math.min(s + 60, lim);
      buckets.push({ key: st.date, label: fmtHM((s/60)|0, 0) + " – " + fmtHM(((e-1)/60)|0, (e-1)%60), tick: fmtHM((s/60)|0, 0), s, e });
    }
  }
  return { labels: buckets.map(b => b.label), values: buckets.map(b => rtMax(b, region)), buckets };
}

function buildEntranceReport(st){
  if(zoneMissing()) return null;
  const spec = bucketSpec(st, "entrance");
  if(!spec || !spec.buckets.length) return null;
  const dayMode = isIntra(st);
  const tCol = st.type === "custom" ? "时间（半小时）" : "时间";
  const cols = dayMode
    ? [tCol, "增量进入人次", "累计进入人次", "增量离开人次", "累计离开人次", "最高空间驻留人数（人）"]
    : ["日期", "累计进入人次", "累计离开人次", "最高空间驻留人数（人）"];
  const blank = {v:"—", cls:"na"};
  const rows = [];
  let cumE = 0, cumX = 0, prevKey = null;
  spec.buckets.forEach((b, i) => {
    const day = RAW[b.key];
    if(!day || day.offline){
      rows.push({ cells: dayMode ? [{v:b.label}, blank, blank, blank, blank, {v:"—", cls:"na"}] : [{v:b.label}, blank, blank, blank] });
      return;
    }
    if(i === 0 || b.key !== prevKey) { cumE = 0; cumX = 0; prevKey = b.key; }   // 跨天清零
    const incE = incInBucket(b, "enter"), incX = incInBucket(b, "exit");
    cumE += incE || 0; cumX += incX || 0;
    const peak = occMaxIn(b);
    const cells = [{v:b.label}];
    if(dayMode) cells.push({v:"+" + incE, cls:"delta"},{v:String(cumE)},{v:"+" + incX, cls:"delta"},{v:String(cumX)});
    else cells.push({v:String(cumE)},{v:String(cumX)});
    cells.push({v: peak == null ? "—" : String(peak)});
    rows.push({ cells });
  });
  const peakAll = spec.buckets.map(b => occMaxIn(b)).filter(v => v != null).reduce((a,b)=>Math.max(a,b), 0);
  const cur = occAt(st.type === "hourly" ? st.date : st.range.to, st.type === "hourly" ? currentMinute() : 1439);
  const chartSeries = [];
  if(dayMode){
    chartSeries.push({ name:"增量进入人次", color: COLOR.blue, type:"bar", data: spec.buckets.map(b => incInBucket(b,"enter")), unit:" 人次" });
    chartSeries.push({ name:"增量离开人次", color: COLOR.green, type:"bar", data: spec.buckets.map(b => incInBucket(b,"exit")), unit:" 人次" });
  }
  chartSeries.push({ name:"累计进入人次", color: COLOR.amber, type:"line", axis:"right", unit:" 人次", data: cumByKey(spec.buckets, spec.buckets.map(b => incInBucket(b,"enter"))) });
  chartSeries.push({ name:"累计离开人次", color: COLOR.pink, type:"line", axis:"right", unit:" 人次", data: cumByKey(spec.buckets, spec.buckets.map(b => incInBucket(b,"exit"))) });
  chartSeries.push({ name:"最高空间驻留人数", color: COLOR.violet, type:"line", axis:"right", unit:" 人", data: spec.buckets.map(b => occMaxIn(b)) });
  const cutoff = Math.min(DEVICE.window.on ? DEVICE.window.end : 1439, statCovOf(st.date) - 1);
  const notes = [
    METRICS.entrance.formula,
    dayMode
      ? (st.type === "custom" ? "自定义视图" : "按时视图") + "统计颗粒度为半小时，首尾时间与统计起止时间一致（当前 "
          + fmtMin(DEVICE.window.on ? DEVICE.window.start : 0) + " – " + fmtHM((cutoff / 60) | 0, cutoff % 60) + "）。"
      : "按日 / 按周 / 按月视图颗粒度为天级，每天独立按统计起止时间统计，跨天清零。",
    "「分时进出与驻留」为设备实际变化上报值；本表为半小时统计维度：进入 / 离开人次为该半小时累计，空间驻留人数取该半小时内的最高值。",
    "手动校准偏移只影响校准操作之后的实时驻留计算，不回溯修改历史报表数据；修改统计时间段同样不回溯历史报表数据。",
    "累计进入 / 离开人次仅全局显示该数据；到达统计截止时间自动清零本周期累计。",
  ];
  return { cols, rows, notes,
    chart: { labels: spec.buckets.map(b => b.label), ticks: spec.buckets.map(b => b.tick || b.label), series: chartSeries,
      title: dayMode ? "半小时人流与最高空间驻留" : "每日人流与最高空间驻留", tag:"统计值",
      grain: dayMode ? "30 分钟颗粒" : "1 天颗粒",
      axisNote: "左轴：增量人次｜右轴：累计人次 · 最高空间驻留人数" },
    summary:[
      {k:"统计区间", v: bucketEndLabel(st, spec), txt:true},
      {k:"当前空间驻留人数", v: cur == null ? "—" : String(cur), u:"人", x:"含校准偏差 " + (DEVICE.calib ? ((DEVICE.calib.offset>0?"+":"") + DEVICE.calib.offset) : "0")},
      {k:"区间累计进入", v: String(cumE), u:"人次"},
      {k:"区间累计离开", v: String(cumX), u:"人次"},
      {k:"区间最高空间驻留", v: String(peakAll), u:"人"},
    ] };
}

function renderChart(el, cfg){

  const mR = dual ? 56 : 16;
  const ticks = (cfg.ticks && cfg.ticks.length === labels.length) ? cfg.ticks : labels;
  const pw = W - mL - mR, ph = H - mT - mB, n = labels.length;
  const capAxis = axis => series.some(s => (s.axis || "left") === axis && s.cap);
  const scaleOf = axis => {
    if(capAxis(axis)) return RT_CAP;                         // 实时人数轴按产品定义固定 0~10
    const vals = series.filter(s => (s.axis || "left") === axis).flatMap(s => s.data).filter(v => v != null);
    const mx = vals.length ? Math.max.apply(null, vals) : 0;
    if(mx <= 0) return 1;
    if(mx < 20) return Math.max(1, Math.ceil(mx / 4)) * 4;   // 人数等小数值用整数刻度，避免出现 3.5 人
    return mx < 200 ? Math.ceil(mx * 1.15) : mx * 1.15;
  };
  const maxL = scaleOf("left"), maxR = scaleOf("right");
  if(dual && Math.round(maxR) === Math.round(maxL)) dual = false;   // 两轴量程一致时不重复标注
  const x = i => mL + (n > 1 ? i * pw / (n - 1) : pw / 2);
  const xc = i => mL + (i + 0.5) * pw / n;
  const y = (v, axis) => { const lim = axis === "right" ? maxR : maxL; return mT + ph - (Math.min(v, lim) / lim) * ph; };
  const bandW = Math.max(3, Math.min(30, pw / n * 0.62));
  const barList = series.filter(z => z.type === "bar");
  const subW = barList.length > 1 ? Math.max(2, bandW / barList.length - 1) : bandW;
  let s = "";
  const gridN = capAxis("left") ? 5 : 4;                      // 0~10 用整数刻度 0/2/4/6/8/10
  for(let g = 0; g <= gridN; g++){
    const yy = mT + ph * g / gridN;
    s += `<line x1="${mL}" y1="${yy.toFixed(1)}" x2="${(mL+pw).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#f0f1f5"/>`;
    s += `<text x="${mL-9}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#5b5f6e">${axLabel(maxL*(gridN-g)/gridN)}</text>`;
    if(dual) s += `<text x="${(mL+pw+9).toFixed(1)}" y="${(yy+4).toFixed(1)}" font-size="11" fill="#5b5f6e">${axLabel(maxR*(gridN-g)/gridN)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 9));
  for(let i = 0; i < n; i += step){
    s += `<text x="${(n===1?x(0):xc(i)).toFixed(1)}" y="${(H-13)}" text-anchor="middle" font-size="11" fill="#5b5f6e">${ticks[i]}</text>`;
  }
  barList.forEach((sr, bi) => {
    const off = (bi - (barList.length - 1) / 2) * (subW + 1);
    sr.data.forEach((v, i) => {
      if(v == null) return;
      const yy = y(v, sr.axis || "left"), h = mT + ph - yy;
      const cx = (n === 1 ? x(0) : xc(i)) + off - subW / 2;
      s += `<rect x="${cx.toFixed(1)}" y="${yy.toFixed(1)}" width="${subW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" fill="${sr.color}" opacity=".82" rx="1"/>`;
    });
  });
  series.filter(z => z.type === "line").forEach(sr => {
    let d = "", open = false;
    sr.data.forEach((v, i) => {
      if(v == null){ open = false; return; }
      const cx = n === 1 ? x(0) : x(i), cy = y(v, sr.axis || "left");
      d += (open ? "L" : "M") + cx.toFixed(1) + " " + cy.toFixed(1) + " "; open = true;
    });
    if(d) s += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round"/>`;
    if(n <= 32) sr.data.forEach((v, i) => {
      if(v == null) return;
      s += `<circle cx="${(n===1?x(0):x(i)).toFixed(1)}" cy="${y(v, sr.axis||"left").toFixed(1)}" r="2.8" fill="#fff" stroke="${sr.color}" stroke-width="1.6"/>`;
    });
  });
  for(let i = 0; i < n; i++){
    const bw = pw / n, bx = n === 1 ? mL : mL + i * bw;
    s += `<rect class="hit" data-i="${i}" x="${bx.toFixed(1)}" y="${mT}" width="${bw.toFixed(1)}" height="${ph}" fill="transparent"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">${s}</svg>`;
  const svg = el.querySelector("svg");
  svg.addEventListener("mousemove", ev => {
    const t = ev.target.closest ? ev.target.closest(".hit") : null;
    if(!t){ hideTip(); return; }
    const i = +t.dataset.i;
    const lines = series.map(sr => {
      const v = sr.data[i];
      const txt = v == null ? "—" : (sr.cap ? fmtRT(v) : axLabel(v, sr.dec)) + (sr.unit || "");
      return `<div class="tr"><span class="sw" style="background:${sr.color}"></span>${sr.name}<span class="tv">${txt}</span></div>`;
    }).join("");
    showTip(ev, `<div class="tt">${labels[i]}</div>${lines}`);
  });
  svg.addEventListener("mouseleave", hideTip);
}
function axLabel(v, dec){
  if(v == null) return "—";
  if(dec != null) return (+v).toFixed(dec);
  const a = Math.abs(v);
  if(a >= 10000) return (v / 10000).toFixed(a >= 100000 ? 0 : 1) + "万";
  if(a >= 10) return String(Math.round(v));
  if(Number.isInteger(v)) return String(v);
  return v.toFixed(1);
}
const tipEl = document.getElementById("tip");
function showTip(ev, html){
  tipEl.innerHTML = html; tipEl.style.display = "block";
  const r = tipEl.getBoundingClientRect();
  let l = ev.clientX + 14, t = ev.clientY - r.height / 2;
  if(l + r.width > innerWidth - 10) l = ev.clientX - r.width - 14;
  if(t < 8) t = 8;
  if(t + r.height > innerHeight - 8) t = innerHeight - r.height - 8;
  tipEl.style.left = l + "px"; tipEl.style.top = t + "px";
}
function hideTip(){ tipEl.style.display = "none"; }

/* =========================================================
 * 导出（Excel 按区域分子 sheet / CSV；文件名 = 设备名称 + 报表起止时间）
 * ========================================================= */
function sheetsFor(m, kind){
  if(m === "dwell") return dwellSheets();
  const st = getState(m);
  const cfg = METRICS[m];
  const spec = bucketSpec(st, m);
  if(!spec || !spec.buckets.length) return null;
  const dayMode = st.type === "hourly";
  const out = [];
  const rowLabel = b => dayMode ? b.label : b.key;
  if(m === "entrance" || m === "distance"){
    const rep = m === "entrance" ? buildEntranceReport(st) : buildReport(m, st);
    out.push({ name: cfg.name, cols: rep.cols, rows: rep.rows.map(r => r.cells.map(c => plain(c.v))) });
    return out;
  }
  const regions = ["全区域", ...REGIONS];
  if(m === "realtime"){
    (kind === "hist" ? [] : regions).forEach(rg => {
      const rows = spec.buckets.map(b => [rowLabel(b), rg, rtMax(b, rg) == null ? "-" : fmtRT(rtMax(b, rg))]);
      out.push({ name: rg + " 时段统计", cols: [dayMode ? "时间" : "日期","区域","最高实时人数（人）"], rows });
    });
    (kind === "hour" ? [] : regions).forEach(rg => {
      const rows = rtLogRows(st, spec, rg).map(r => [r.t, rg, fmtRT(r.v)]);
      out.push({ name: rg + " 上报明细", cols: ["时间","区域","实时人数（人）"], rows });
    });
    return out;
  }
  if(m === "visits" && kind === "hour"){
    return regions.map(rg => {
      let run = 0;
      const rows = spec.buckets.map(b => {
        const inc = incInBucket(b, "visits", rg);
        if(!dayMode) return [rowLabel(b), rg, inc == null ? "-" : inc];
        if(inc == null) return [rowLabel(b), rg, "-", "-"];
        run += inc; return [rowLabel(b), rg, inc, run];
      });
      return { name: rg, cols: dayMode ? ["时间","区域","增量人次","累计人次"] : ["日期","区域","当日访问人次"], rows };
    });
  }
  if(m === "visits"){
    regions.forEach(rg => {
      let run = 0;
      const rows = spec.buckets.map(b => {
        const inc = incInBucket(b, "visits", rg);
        if(!dayMode) return [rowLabel(b), rg, inc == null ? "-" : inc];
        if(inc == null) return [rowLabel(b), rg, "-", "-"];
        run += inc;
        return [rowLabel(b), rg, inc, run];
      });
      out.push({ name: rg, cols: dayMode ? ["时间","区域","增量人次","累计人次"] : ["日期","区域","当日访问人次"], rows });
    });
    return out;
  }
  return null;
}
/* 平均驻留时长导出：跟随当前板块——当天＝各区域分时累计；历史日期＝全天总览 + 所选区域分时累计；历史对比＝近 N 天倒序矩阵 */
function dwellSheets(){
  const st = getState("dwell");
  if(st.dwTab === "hist"){
    const n = st.dwRange, keys = [];
    for(let i = n - 1; i >= 0; i--) keys.push(fmtDate(addDays(new Date(), -i)));
    const colRgs = REGIONS.concat(["全区域"]);
    const rows = keys.slice().reverse().map(k => {
      const d = RAW[k];
      return [k + (k === todayKey() ? "（截至当前）" : "")].concat(colRgs.map(rg => {
        if(!d || d.offline) return "-";
        const v = dayTotalVisits(k, rg), m = dayTotalPersonMin(k, rg);
        return v ? (m / v).toFixed(1) : "-";
      }));
    });
    return [{ name:"各日期各区域平均驻留时长", cols:["日期"].concat(colRgs), rows }];
  }
  const key = st.dwDate, region = st.region;
  if(key === todayKey()){
    return REGIONS.concat(["全区域"]).map(rg => {
      const rs = dwellCumRows(key, rg);
      return { name: rg + " 分时累计", cols: dwellCumCols(),
        rows: rs.map(r => [r.label, r.inc, r.cumM, r.avg == null ? "-" : r.avg]) };
    });
  }
  const ov = dwellDayOverview(key), cum = dwellCumRows(key, region);
  return [
    { name:"全天总览", cols:["区域", "访问人次（人次）", "累计驻留（人·分钟）", "平均驻留时长（分钟）"],
      rows: ov.map(r => [r.rg, r.v, r.m, r.avg == null ? "-" : r.avg]) },
    { name: region + " 分时累计", cols: dwellCumCols(),
      rows: cum.map(r => [r.label, r.inc, r.cumM, r.avg == null ? "-" : r.avg]) },
  ];
}
function plain(v){
  const s = String(v).replace(/,/g, "").replace(/^\+/, "").replace(/（.*$/, "");
  const n = Number(s);
  return isNaN(n) || s === "" ? String(v) : n;
}
function fileName(m, ext, kind){
  if(m === "dwell"){
    const st = getState("dwell");
    const span = st.dwTab === "hist"
      ? fmtCompact(fmtDate(addDays(new Date(), -(st.dwRange - 1)))) + "-" + fmtCompact(todayKey())
      : fmtCompact(st.dwDate) + "-" + fmtCompact(st.dwDate);
    return `${DEVICE_NAME}_平均驻留时长_${span}.${ext}`;
  }
  const st = getState(m);
  const from = isIntra(st) && st.type === "hourly" ? st.date : st.range.from;
  const to = isIntra(st) && st.type === "hourly" ? st.date : st.range.to;
  return `${DEVICE_NAME}_${tableTitle(m, kind)}_${fmtCompact(from)}-${fmtCompact(to)}.${ext}`;
}
function tableTitle(m, kind){
  if(!kind) return METRICS[m].name;
  if(m === "visits") return kind === "hist" ? "访问人次变化上报日志" : "访问人次半小时统计";
  if(m === "distance") return kind === "hist" ? "行走距离变化上报日志" : "行走距离半小时统计";
  if(m !== "realtime") return METRICS[m].name;
  return kind === "hist" ? (m === "visits" ? "访问人次变化上报" : "实时人数上报记录") : "实时人数时段最大值";
}
function exportTable(m, kind, ext){
  const sheets = sheetsFor(m, kind);
  if(!sheets || !sheets.length){ alert("所选时间段无数据"); return; }
  if(ext === "csv") return writeCSV(m, sheets, kind);
  if(typeof XLSX === "undefined"){ alert("当前环境无法加载 Excel 导出组件，请联网后重试，或使用「导出 CSV」"); return; }
  const wb = XLSX.utils.book_new();
  appendSheets(wb, sheets);
  XLSX.writeFile(wb, fileName(m, "xlsx", kind));
}
function exportExcel(m){
  if(typeof XLSX === "undefined"){ alert("当前环境无法加载 Excel 导出组件，请联网后重试，或使用「导出 CSV」"); return; }
  const sheets = sheetsFor(m);
  if(!sheets){ alert("所选时间段无数据"); return; }
  const wb = XLSX.utils.book_new();
  appendSheets(wb, sheets);
  XLSX.writeFile(wb, fileName(m, "xlsx"));
}
function appendSheets(wb, sheets){
  sheets.forEach(sh => {
    const ws = XLSX.utils.aoa_to_sheet([sh.cols, ...sh.rows]);
    ws["!cols"] = sh.cols.map(() => ({wch: 20}));
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  });
}
function exportCSV(m){ writeCSV(m, sheetsFor(m)); }
function writeCSV(m, sheets, kind){
  if(!sheets || !sheets.length){ alert("所选时间段无数据"); return; }
  const esc2 = c => { const s = String(c == null ? "-" : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const text = sheets.map(sh => `# ${sh.name}\n` + [sh.cols, ...sh.rows].map(r => r.map(esc2).join(",")).join("\n")).join("\n\n");
  const blob = new Blob(["\ufeff" + text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName(m, "csv", kind);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =========================================================
 * 弹窗：统计时间段 / 手动校准 / 进出口区域
 * ========================================================= */
function openWindowModal(){
  const mask = document.createElement("div");

    <h3>统计时间段设置</h3>

      <div class="rows">
        <div class="r"><label>功能开关</label><span class="sw ${cur.on?"on":""}" id="swOn"></span>

      </div>
      <div class="note" style="margin-top:14px">开启状态下统计周期默认 00:00:00 – 23:59:59，可自定义起止时间，截止时间允许设置为次日时刻，整个统计周期时长上限为 24 小时。到达截止时间后自动清空本周期累计数据，开启新一轮周期统计。中途修改起止时间立即生效并清空当前累计，按新起始时间基于设备上报增量重新计算当日数据；空间驻留人数与校准偏移量不受本次修改影响。</div>
    </div>
    <div class="foot"><button class="btn ghost" id="wCancel">取消</button><button class="btn" id="wSave">保存</button></div>
  </div>`;
  document.body.appendChild(mask);
  let on = cur.on;
  const sw = mask.querySelector("#swOn");
  sw.onclick = () => { on = !on; sw.classList.toggle("on", on); };
  mask.querySelector("#wCancel").onclick = () => mask.remove();
  mask.querySelector("#wSave").onclick = () => {
    const toMin = v => { const p = v.split(":").map(Number); return p[0] * 60 + p[1]; };
    let s = toMin(mask.querySelector("#wStart").value);
    let e = toMin(mask.querySelector("#wEnd").value);
    if(e <= s) e += 24 * 60;
    if(e - s > 24 * 60){ alert("整个统计周期时长上限为 24 小时"); return; }
    DEVICE.window = { on, start: s, end: Math.min(e, 24 * 60 - 1) };
    /* 开启 / 修改后立即清空当前累计并基于新起始时间重算 */
    DEVICE.calib = null;
    genData(); mask.remove(); render();
  };
}
function openCalibModal(){
  const key = todayKey();
  const cov = currentMinute();
  const raw = occRawAt(key, cov);
  if(raw == null){ alert("设备离线，暂无可校准的数据"); return; }
  const mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML = `<div class="modal">
    <h3>手动校准空间驻留人数</h3>
    <div class="body">
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:10px">设备当前上报原始空间驻留人数 ${raw} 人（${fmtMin(cov)}）</div>
      <div class="rows">
        <div class="r"><label>实际驻留人数</label><input type="number" id="cVal" min="0" max="10000" value="${Math.max(0, raw + (DEVICE.calib ? DEVICE.calib.offset : 0))}" style="width:120px">
          <span style="font-size:12px;color:var(--ink-3)">0 ~ 10000</span></div>
        <div class="r"><label>校准人数（偏移量）</label><span id="cOff">${DEVICE.calib ? (DEVICE.calib.offset>0?"+":"") + DEVICE.calib.offset : "0"}</span></div>
      </div>
      <div class="note" style="margin-top:14px">校准后空间驻留人数 =（累计进入人次 − 累计离开人次）+ 校准人数，最小值为 0 不可为负。偏移量 = 用户手动输入的驻留人数 − 设备上报的最新驻留人数，支持正数、负数。切换工作模式后校准配置清空；校准只影响本次操作之后的实时驻留计算，不回溯修改历史报表数据。</div>
    </div>
    <div class="foot"><button class="btn ghost" id="cClear">清除校准</button><button class="btn ghost" id="cCancel">取消</button><button class="btn" id="cSave">保存校准</button></div>
  </div>`;
  document.body.appendChild(mask);
  const input = mask.querySelector("#cVal"), offEl = mask.querySelector("#cOff");
  const upd = () => { const v = Number(input.value); offEl.textContent = isNaN(v) ? "" : ((v - raw > 0 ? "+" : "") + (v - raw)); };
  input.oninput = upd; upd();
  mask.querySelector("#cCancel").onclick = () => mask.remove();
  mask.querySelector("#cClear").onclick = () => { DEVICE.calib = null; mask.remove(); render(); };
  mask.querySelector("#cSave").onclick = () => {
    const v = Number(input.value);
    if(isNaN(v) || v < 0 || v > 10000){ alert("用户输入的实际驻留人数范围限制：0~10000"); return; }
    DEVICE.calib = { offset: v - raw, input: v, atMin: cov };
    DEVICE.prompted = true;
    mask.remove(); render();
  };
}
/* =========================================================
 * 区域配置页（仿 Studio 设备详情 · 区域配置）
 * 看板「进出口配置」跳转至此；保存后监测区域与进出口区域同步回数据看板
 * ========================================================= */
const ZONE_TYPES = ["监测区域","干扰区域","进出口区域","边缘区域","跌倒屏蔽区域"];
const ZONE_COLORS = ["#5B6EF7","#3ECFA0","#F5A623","#4FB6F0","#F77291","#8ED8F8","#9BD27A","#F7A6C0","#7B8CFF"];
const GRID = { rows:14, cols:12 };
let ZD = null;                                   // 配置页草稿状态

function ensureZones(dev){
  if(dev.zoneModel) return dev.zoneModel;
  const rows = GRID.rows, cols = GRID.cols;
  const zones = []; let id = 1;
  const nb = dev.regions.length, usable = rows - 1;   // 末行留给边缘区域
  dev.regions.forEach((name, i) => {
    const z = { id:id++, name, type:"监测区域", color: ZONE_COLORS[i % ZONE_COLORS.length], cells:[] };
    const r0 = Math.floor(usable * i / nb), r1 = Math.floor(usable * (i + 1) / nb);
    for(let r = r0; r < r1; r++) for(let c = 0; c < cols - 2; c++) z.cells.push(r + "," + c);
    zones.push(z);
  });
  const edge = { id:id++, name:"边缘区域", type:"边缘区域", color:"#C9CCD6", cells:[] };
  for(let c = 0; c < cols; c++) edge.cells.push((rows - 1) + "," + c);
  zones.push(edge);
  if(dev.state.mode === "entrance"){
    const ent = { id:id++, name: dev.entryZone ? dev.entryZone.name : "进出口", type:"进出口区域", color:"#5B6EF7", cells:[] };
    [[0,cols-2],[0,cols-1],[1,cols-2],[1,cols-1],[4,cols-2],[4,cols-1],[5,cols-2],[5,cols-1]]
      .forEach(p => ent.cells.push(p.join(",")));
    zones.push(ent);
  }
  dev.zoneModel = { zones, nextId: id };
  return dev.zoneModel;
}
function countBlocks(cells){
  const set = new Set(cells), seen = new Set();
  let n = 0;
  set.forEach(k => {
    if(seen.has(k)) return;
    n++; const stack = [k]; seen.add(k);
    while(stack.length){
      const [r,c] = stack.pop().split(",").map(Number);
      [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(p => {
        const key = p[0] + "," + p[1];
        if(set.has(key) && !seen.has(key)){ seen.add(key); stack.push(key); }
      });
    }
  });
  return n;
}
function renderZoneConfig(){
  renderHeader();
  crumb.innerHTML = `<a href="#/">${DEVICE_NAME}</a><span class="sep">/</span><a href="#/">数据统计</a><span class="sep">/</span><span>区域配置</span>`;
  const model = ensureZones(CUR);
  if(!ZD || ZD.devId !== CUR.id){
    ZD = { devId: CUR.id, draft: JSON.parse(JSON.stringify(model.zones)), nextId: model.nextId,
           sel: (model.zones.find(z => z.type === "进出口区域") || model.zones[0]).id, dirty:false };
  }
  const sel = ZD.draft.find(z => z.id === ZD.sel) || ZD.draft[0];
  ZD.sel = sel ? sel.id : null;
  const owner = {};
  ZD.draft.forEach(z => z.cells.forEach(c => owner[c] = z));
  const entrance = CUR.state.mode === "entrance";
  app.innerHTML = `
    <div class="zcfg-head">
      <div>
        <div class="page-title">区域配置</div>
        <div class="page-sub">${DEVICE_NAME} · ${entrance ? "进出口人流统计模式" : "存在监测模式"}；进出口区域仅支持 1 个，可在地图上圈选不连续的多块网格，保存后同步至数据看板</div>
      </div>
      <div class="zcfg-actions">
        <span class="dirty-tip ${ZD.dirty?"show":""}">有未保存的修改</span>
        <button class="btn ghost" id="zCancel">放弃修改</button>
        <button class="btn" id="zSave">保存并返回数据看板</button>
      </div>
    </div>
    <div class="zcfg-dev">
      <span class="zico"></span>
      <div>
        <div class="zname">${DEVICE_NAME}</div>
        <div class="zmeta">状态：<em class="${deviceOfflineNow()?"off":""}">${deviceOfflineNow()?"离线":"在线"}</em>
          · 关联设备：Edge Hub · 区域数量：${ZD.draft.length} 个 · 网格：${GRID.rows} × ${GRID.cols}</div>
      </div>
      <a class="back-btn" href="#/" style="margin-left:auto">← 返回数据看板</a>
    </div>
    <div class="zcfg-tabs"><span>功能点</span><span class="on">区域配置</span></div>
    <div class="zcfg-body">
      <div class="zmap">
        <div class="zmap-grid" id="zGrid">
          ${Array.from({length: GRID.rows * GRID.cols}, (_, i) => {
            const r = Math.floor(i / GRID.cols), c = i % GRID.cols, key = r + "," + c;
            const z = owner[key];
            return `<div class="zcell ${z?"fill":""} ${sel && z && z.id===sel.id?"mine":""}" data-k="${key}"
              style="${z?`background:${z.color}${z.type==="边缘区域"?"55":"33"}`:""}">${
              z && z.cells[0] === key ? `<span class="zlabel" style="color:${z.color}">${z.name}</span>` : ""}</div>`;
          }).join("")}
        </div>
        <div class="note">点击网格即可将格子划入 / 移出左侧选中的区域；进出口区域可由多块不连续网格组成。</div>
      </div>
      <div class="zlist">
        <div class="zlist-head">区域列表 <span>${ZD.draft.length} 个区域</span></div>
        ${ZD.draft.map(z => `
          <div class="zcard ${z.id===ZD.sel?"on":""}" data-id="${z.id}">
            <div><div class="zn">${z.name || "未命名区域"}</div><div class="zt">${z.type}</div></div>
            <span class="zdot" style="background:${z.color}"></span>
          </div>`).join("")}
        <button class="btn ghost" id="zAdd" style="margin-top:10px">+ 新建区域</button>
      </div>
      <div class="zdetail">
        <div class="zlist-head">区域详情 <span>ID ${sel ? sel.id : "—"}</span></div>
        ${sel ? `
        <div class="zfield"><label>区域类型</label>
          <select id="zType">${ZONE_TYPES.map(t => `<option ${t===sel.type?"selected":""}>${t}</option>`).join("")}</select>
          ${sel.type === "进出口区域" ? '<div class="zhint">进出口逻辑仅允许设置 1 个区域</div>' : ""}
        </div>
        <div class="zfield"><label>区域名称</label><input type="text" id="zName" value="${sel.name}" maxlength="12"></div>
        <div class="zfield"><label>已选网格</label>
          <div class="zcount"><strong>${sel.cells.length}</strong> 当前已选择网格${sel.cells.length ? ` · ${countBlocks(sel.cells)} 块不连续区域` : ""}</div>
        </div>
        <div class="zbtns"><button class="btn ghost" id="zClear">清空网格</button><button class="btn danger" id="zDel">删除区域</button></div>
        ${sel.type === "进出口区域" ? `<div class="zbtns"><button class="btn ghost" id="zUnset">清除进出口配置（看板将显示 “—”）</button></div>` : ""}
        ` : '<div class="empty" style="border:none">暂无区域，请点击「+ 新建区域」</div>'}
        <div class="note">工作模式在设备功能页切换：切换为进出口人流统计模式后需先设置进出口区域才生效，其他监测功能点将不再显示、相关自动化失效。</div>
      </div>
    </div>`;

  document.getElementById("zGrid").addEventListener("click", e => {
    const cell = e.target.closest(".zcell"); if(!cell || !sel) return;
    const k = cell.dataset.k;
    const other = ZD.draft.find(z => z.cells.indexOf(k) >= 0);
    if(other && other.id === sel.id) sel.cells.splice(sel.cells.indexOf(k), 1);
    else { if(other) other.cells.splice(other.cells.indexOf(k), 1); sel.cells.push(k); }
    ZD.dirty = true; renderZoneConfig();
  });
  document.querySelector(".zlist").addEventListener("click", e => {
    const c = e.target.closest(".zcard"); if(!c) return;
    ZD.sel = Number(c.dataset.id); renderZoneConfig();
  });
  document.getElementById("zAdd").onclick = () => {
    ZD.draft.push({ id: ZD.nextId++, name: "区域" + (ZD.draft.length + 1), type:"监测区域",
      color: ZONE_COLORS[ZD.draft.length % ZONE_COLORS.length], cells:[] });
    ZD.sel = ZD.draft[ZD.draft.length-1].id; ZD.dirty = true; renderZoneConfig();
  };
  document.getElementById("zType").onchange = e => {
    const t = e.target.value;
    if(t === "进出口区域" && ZD.draft.some(z => z.type === "进出口区域" && z.id !== sel.id)){
      alert("仅允许设置 1 个进出口区域"); return;
    }
    sel.type = t; ZD.dirty = true; renderZoneConfig();
  };
  document.getElementById("zName").oninput = e => { sel.name = e.target.value; ZD.dirty = true; };
  document.getElementById("zName").onchange = () => renderZoneConfig();
  document.getElementById("zClear").onclick = () => { sel.cells = []; ZD.dirty = true; renderZoneConfig(); };
  document.getElementById("zDel").onclick = () => {
    ZD.draft = ZD.draft.filter(z => z.id !== sel.id);
    ZD.sel = ZD.draft.length ? ZD.draft[0].id : null; ZD.dirty = true; renderZoneConfig();
  };
  const unbtn = document.getElementById("zUnset");
  if(unbtn) unbtn.onclick = () => {
    CUR.entryZone = null; CUR.state.zonePrompted = false;
    ZD.dirty = true; renderZoneConfig();
    toast("已清除进出口配置，数据看板将显示 “—”");
  };
  document.getElementById("zCancel").onclick = () => { ZD = null; location.hash = "#/"; };
  document.getElementById("zSave").onclick = saveZones;
}
function saveZones(){
  const draft = ZD.draft;
  const names = draft.filter(z => z.type === "监测区域").map(z => (z.name || "").trim());
  if(!names.length){ alert("至少需要 1 个监测区域"); return; }
  if(new Set(names).size !== names.length){ alert("监测区域名称不可重复"); return; }
  if(draft.some(z => !z.name || !z.name.trim())){ alert("区域名称不可为空"); return; }
  if(CUR.state.mode === "entrance" && !draft.some(z => z.type === "进出口区域" && z.cells.length)){
    alert("进出口人流统计模式需先设置进出口区域才生效"); return;
  }
  const ent = draft.find(z => z.type === "进出口区域");
  /* 进出口就是一个区域名称（仅 1 个），看板只同步名称，不展示网格细节 */
  CUR.entryZone = ent ? { name: ent.name.trim() } : null;
  CUR.state.zonePrompted = false;
  CUR.regions = names;
  CUR.zoneModel = { zones: JSON.parse(JSON.stringify(draft)), nextId: ZD.nextId };
  ZD = null;
  genData();                                   // 区域变更后按新配置重新统计
  useDevice(CUR.id);
  location.hash = DEVICE.mode === "entrance" ? "#/entrance" : "#/";
  toast("区域配置已保存，数据看板已同步");
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("on"), 20);
  setTimeout(() => { el.classList.remove("on"); setTimeout(() => el.remove(), 260); }, 2400);
}

/* ---------- 刷新 / 启动 ---------- */
document.getElementById("refreshBtn").onclick = () => { genData(); render(); };
genData();
render();
</script>
</body>
</html>
